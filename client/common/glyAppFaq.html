<template name="glyAppFaq">
    <script type="text/javascript" src="/libs/common.js"></script>
    <script type="text/javascript" src="/libs/sub.js"></script>
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <h3 class="subTit">
                    <span class="subTit__inner" id="move">
                        FAQ
                        <a href="/glyAppInq"><button type="button" class="subTit__sideBtn">파트너 센터 문의하기</button></a>
                    </span>
                </h3>
                {{#if renderFlag}}
                    <div class="sub-content">
                        <div class="sub-content__faq">
                            <div class="faq-wrap">
                                <div class="faq-list">
                                    <p class="faq-list__tit">자주 묻는 질문 Top6</p>
                                    {{#each faqInfo}}
                                        <button type="button" class="faq-item">
                                            <img src="/image/sub/icon/icon-faq-bullet.png" alt="">
                                            {{title}}
                                        </button>
                                        <p class="faq-cont">{{desc}}</p>
                                    {{/each}}
                                </div>
                                <div class="faq-askBox">
                                    <p>
                                        궁금한 내용을 찾지 못하셨나요?<br/>
                                        걱정하지 마시고 <a href="/glyAppInq"><span class="color-blue">파트너 센터 문의하기</span></a> 로 문의해 주세요.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                {{/if}}
            </div>
        </div>
    </section>
    <footer class="footer">
        {{> footer}}
    </footer>
</template>
