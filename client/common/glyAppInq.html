<template name="glyAppInq">
    {{#if glyAppInqNextFlag}}
        <!-- 문의하기 첫 화면 -->
        <section class="container">
            <div class="content">
                <div class="content__inner">
                    <h3 class="subTit">
                        <span class="subTit__inner">
                            파트너센터 문의하기
                        </span>
                    </h3>
                    <div class="sub-content bg--gray">
                        <div class="sub-content__partner">
                            <div class="partner-wrap width--900">
                                <div class="partner-view">
                                    <p class="txt color--txt font-14">
                                        안녕하세요. 인플럭스 파트너센터입니다.
                                        문의에 대한 답변은 남겨주신 이메일로 발송되며, 영업일 기준 평균 3-4시간 정도 소요됩니다.
                                        대량 변경이나 내부 확인이 필요한 건은 추가 시간이 소요될 수 있으니 양해 부탁 드립니다.
                                        답변을 받지 못하신 경우 '스팸/정크 메일함' 확인 및 차단 여부를 확인해ㅋㅋ 주세요.                                        
                                    </p>
                                    <h3 class="mt-70 font-20 fontW-b color--txt">이메일 주소 *</h3>
                                    <p class="mt-10 txt color--txt font-14">오탈자가 없는지 한번 더 확인해 주세요. 올바른 메일 주소에만 답변을 보내드릴 수 있습니다.</p>
                                    <div class="form-wrap">
                                        <div class="form-input">
                                            <input type="text" name="emailAdd" class="width--420 height-45" />
                                        </div>
                                    </div>
                                    <h3 class="mt-70 font-20 fontW-b color--txt">파트너 상태 *</h3>
                                    <div class="btn-wrap mt-20">
                                        <button type="button" class="partner-sel"><span class="bg--lightBlack color--white">A</span>파트너</button>
                                        <button type="button" class="partner-sel is-active mt-10"><span class="bg--blue color--white">B</span>예비파트너</button>
                                    </div>
                                    <h3 class="mt-50 font-20 fontW-b color--txt">개인정보 수집 *</h3>
                                    <p class="txt mt-10 color--txt font-14">개인정보보호법에 의거 다음과 같이 개인정보 수집 및 이용 목적을 알려드립니다.</p>
                                    <p class="txt mt-10 color--txt font-14">
                                        1. 수집하는 항목 : 이메일 <br/>
                                        2. 수집하는 목적 : 파트너 문의 처리 / 상담 진행 <br/>
                                        3. 보관기간 : 상담 종료 시까지                                        
                                    </p>
                                    <div class="form-wrap mt-50">
                                        <div class="form-check form-row">
                                            <input type="checkbox" id="check-partner--admit" />
                                            <label for="check-partner--admit">동의합니다.</label>
                                        </div>
                                    </div>
                                    <div class="btn-wrap mt-70 ta-c">
                                        <button name="nextBtn" type="button" class="btn btn--blue d-flex align-center width--107">
                                            다음
                                            <img src="/image/common/icon/icon-btn--right.png" class="ml-auto" alt="">
                                        </button>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    {{else}}
        <!-- 문의하기 다음 클릭시 다음화면 -->
        <section class="container">
            <div class="content">
                <div class="content__inner">
                    <h3 class="subTit">
                        <span class="subTit__inner">
                            파트너센터 문의하기
                        </span>
                    </h3>
                    <div class="sub-content bg--gray">
                        <div class="sub-content__partner">
                            <div class="partner-wrap width--900">
                                <div class="partner-view">
                                    <button type="button">뒤로</button>
                                    <h3 class="mt-70 font-20 fontW-b color--txt">예비 파트너사명 *</h3>
                                    <p class="mt-10 txt color--txt font-14">오탈자가 없는지 한번 더 확인해 주세요. 올바른 메일 주소에만 답변을 보내드릴 수 있습니다.</p>
                                    <div class="form-wrap">
                                        <div class="form-input">
                                            <input type="text" class="width--420 height-45" />
                                        </div>
                                    </div>
                                    <h3 class="mt-70 font-20 fontW-b color--txt">사업자 등록번호 *</h3>
                                    <p class="mt-10 txt color--txt font-14">국내 사업자의 경우 000-00-00000  형식으로 작성 부탁 드립니다</p>
                                    <div class="form-wrap">
                                        <div class="form-input">
                                            <input type="text" class="width--420 height-45" placeholder="000-00-00000" />
                                        </div>
                                    </div>
                                    <h3 class="mt-70 font-20 fontW-b color--txt">문의 유형 *</h3>
                                    <div class="btn-wrap ask-kind mt-20">
                                        <button type="button">A 입점신청서 수정/취소</button>
                                        <button type="button">B 입점결과</button>
                                        <button type="button">C 입점계약</button>
                                        <button type="button">D 계정</button>
                                        <button type="button">E 해외사업자</button>
                                        <button type="button">F 기타</button>
                                    </div>
                                    <h3 class="mt-50 font-20 fontW-b color--txt">문의 내용 *</h3>
                                    <div class="form-wrap mt-20">
                                        <div class="form-textarea">
                                            <textarea name="" id="" class="resize-on"></textarea>
                                        </div>
                                    </div>
                                    <h3 class="mt-50 font-20 fontW-b color--txt">파일 첨부하기 *</h3>
                                    <div class="attached-file mt-20">
                                        <button type="button">
                                            <img src="/image/sub/icon/icon-download.png" alt="">
                                            클릭하여 파일을 선택하거나 여기로 드래그 하세요
                                        </button>
                                    </div>
                                    
                                    <div class="btn-wrap mt-50 ta-c">
                                        <button type="button" class="btn btn--blue d-flex align-center justify-center width--107">
                                            제출하기
                                        </button>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    {{/if}}
</template>
