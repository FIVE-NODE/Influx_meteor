<template name="zTwoA">
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <div class="sub-content bg--gray">
                    <div class="sub-content__notice">
                        {{#if noticeInfo}}
                            <div class="notice-wrap width--900">
                                <div class="notice-view">
                                    <div class="notice-view__tit">{{noticeInfo.title}}</div>
                                    <div class="notice-view__date">{{noticeInfo.insDt}}</div>
                                    <div class="notice-editor">
                                        <div class="notice-editor__view">{{noticeInfo.desc}}
                                        </div>
                                    </div>
                                </div>
                                <div class="btn-wrap mt-60 mb-40 ta-c">
                                    <button name="backBtn" type="button" class="btn btn--blue btn-linkTo--list">목록으로 돌아가기</button>
                                </div>
                            </div>
                        {{/if}}
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        {{> footer}}
    </footer>
</template>
