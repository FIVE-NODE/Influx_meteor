<template name="zTwo">
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <h3 class="subTit">
                    <span class="subTit__inner" id="move">
                        공지사항
                    </span>
                </h3>
                <div class="sub-content bg--gray">
                    <div class="sub-content__notice">
                        <div class="notice-wrap width--900">
                            <div class="notice-list">
                                {{#each noticeInfo}}
                                    <div class="notice-item" value="{{_id}}" name="noticeDetail">
                                        <a href="" class="notice-item__tit">{{title}}</a>
                                        <a href="" class="notice-item__date">{{insDt}}</a>
                                    </div>
                                {{/each}}
                            </div>
                            <div class="gallery__inner">
                                <div class="pagination-wrap mt-100 mb-60">
                                    <div class="pagination">
                                        <a href="" name="prev" class="link-prev"></a>
                                        {{#each page}}
                                            <a href="" id="pageNum{{num}}" name="pageNum" class="{{active}}">{{num}}</a>
                                        {{/each}}
                                        <a href="" name="next" class="link-next"></a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        {{> footer}}
    </footer>
</template>
