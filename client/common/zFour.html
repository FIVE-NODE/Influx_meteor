    <section class="container">

                <h3 class="subTit">
                    <span class="subTit__inner">

                    </span>

                <div class="sub-content">
                    <div class="sub-content__private">
                        <div class="private-wrap width--900">4. 보유기간이 경과한 개인정보는 지체없이 파기합니다.

                            ① 회사는 개인정보 보유기간의 경과, 처리목적 달성 등 개인정보가 불필요하게 되었을 때에는 지체없이 해당 개인정보를 파기합니다. ② 정보주체로부터 동의받은 개인정보의 보유기간이 경과하거나 처리 목적이 달성되었음에도 불구하고 다른 법령에 따라 개인정보를 계속 보존하여야 하는 경우에는 해당 개인정보를 별도의 데이터베이스로 옮기거나 보관장소를 달리하여 보존합니다. 별도 보관하는 법령 근거 및 보관하는 정보에 관해서는 본 처리방침 제1조제3항제4호를 참고하시기 바랍니다.③ 개인정보의 파기 절차 및 방법은 다음과 같습니다.

                            - 파기 절차 : 회사는 파기 사유가 발생한 개인정보를 선정하고, 개인정보 보호책임자의 승인을 받아 개인정보를 파기합니다.
                            
                            - 파기 방법 : 회사는 전자적 파일 형태로 기록, 저장된 개인정보는 기록을 재생할 수 없도록 파기하며, 종이문서에 기록, 저장된 개인정보는 분쇄기로 분쇄하거나 소각하여 파기합니다.

                            5. 회사는 이용자에게 다른 회사의 웹사이트 또는 자료에 대한 링크를 제공할 수 있습니다.

                            회사가 이용자에게 다른 회사의 웹사이트 또는 자료에 대한 링크를 제공하는 경우, 회사는 외부사이트 및 자료에 대한 아무런 통제권이 없으므로 그로부터 제공받는 서비스나 자료의 유용성에 대해 책임질 수 없으며 보증할 수 없습니다. 회사가 포함하고 있는 링크를 클릭(click)하여 타사이트(site)의 페이지로 옮겨 갈 경우 해당 사이트의 개인정보보호정책은 회사와 무관하므로 새로 방문한 사이트의 정책을 검토해보시기 바랍니다.

                            6. 이용자 및 법정대리인은 아래와 같은 권리를 행사할 수 있습니다.

                            ① 이용자 및 법정대리인은 언제든지 개인정보 열람/정정/삭제/처리정지 요구 등의 권리를 행사할 수 있습니다. 다만, 동의 철회․삭제시 서비스의 일부 또는 전부 이용이 제한될 수 있습니다. ② (조회/수정 및 정정) 홈페이지에서 ‘마이페이지>설정>회원정보수정’ 메뉴 또는 1:1 상담을 이용하여 처리할 수 있습니다. 처리가 완료될 때까지 해당 정보를 이용하거나 타인에게 제공하지 않을 것입니다. 또한 합리적인 사유로 잘못된 개인정보를 제3자에게 이미 제공한 경우, 정정 처리의 결과를 지체 없이 제3자에게 통지하여 정정하도록 조치합니다. ③ (동의 철회/삭제) 1:1 상담을 이용하여 수집 정보에 대한 동의 철회 및 삭제를 요청하실 수 있습니다. 다만, 수집정보에 대한 동의 철회․삭제시 서비스의 일부 또는 전부 이용이 제한될 수 있으며, 다른 법령에 따라 수집하는 정보의 경우에는 동의 철회가 어려울 수 있습니다. ④ (회원 탈퇴) 홈페이지의 ‘마이페이지>설정>회원정보수정>탈퇴하기’ 메뉴를 이용하여 편리하게 직접 탈퇴를 진행하시거나, 1:1상담을 통하여 진행할 수 있습니다. ⑤ (상담/문의) 회사는 개인정보의 수집 및 이용 목적에 따라 이용자와 상담원 간의 통화내용을 녹음할 수 있으며 고객센터를 통한 소비자 상담/문의 시 녹음 등에 대한 안내는 고객센터 상담 전 안내 멘트를 통해 확인하실 수 있습니다.

                            7. 개인정보 열람 청구에 관한 사항은 다음과 같습니다.

                            ① 이용자는 언제든지 이용자 본인의 개인정보를 열람하거나 정정할 수 있습니다. 회사는 정보주체의 개인정보 열람 청구가 신속하게 처리되도록 노력하겠습니다.② 개인정보 열람 청구는 본 처리방침 제13조의 개인정보 보호책임자 또는 개인정보 민원처리 담당부서에 서면/전자우편/전화로 요청하실 수 있으며, 회사는 요청을 받은 경우 본인확인 절차를 거쳐 지체없이 조치하겠습니다.

                            8. 자동 수집되는 개인정보 및 거부에 관한 사항은 다음과 같습니다.
                            
                            회사는 이용자의 정보를 수시로 저장하고 찾아내는 쿠키(cookie) 등을 사용합니다. 쿠키는 웹사이트가 이용자의 컴퓨터 브라우저에 보내는 아주 작은 텍스트 파일로 이용자의 컴퓨터 하드디스크에 저장됩니다. ① 쿠키의 사용 목적 - 회원과 비회원의 접속 빈도나 방문 시간 등의 분석, 이용 형태 및 관심분야 파악, 자취 추적, 각종 이벤트 참여 정도, 방문 횟수 파악 등을 통한 타겟 마케팅 등 개인별 맞춤 서비스를 제공하기 위해 쿠키를 사용 합니다.
