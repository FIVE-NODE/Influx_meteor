<template name="glyAppEntry">
    <script type="text/javascript" src="/libs/common.js"></script>
    <script type="text/javascript" src="/libs/sub.js"></script>
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <h3 class="subTit subTit--company">
                    <div class="subTit__inner  d-flex align-center justify-center">
                        <img class="header-logo-img" src="/image/common/img-logo-default.png" alt="">
                        스토어 관리센터
                    </div>
                </h3>
                <div class="sub-content">
                    <div class="sub-content__company">
                        <p class="mt-50 font-32 fontW-b ta-c">입 점 신 청</p>
                        <ul class="lists lists-dot lists-dot--big mt-50">
                            <li>입점 신청 관련 궁금한 사항은 <a href="/glyAppFaq"><span class="color-blue" name="appEntryFaq">[SJLab FAQ]</span></a>에서 확인하실 수 있습니다.</li>
                            <li>자주 사용하는 메일 주소를 올바르게 입력해 주세요. 한 달 내에 기재해 주신 메일 주소로 입점 결과를 보내드립니다.</li>
                            <li>입점 검토 중에는 중복 신청이 불가합니다.</li>
                            <li>기존 신청 건 수정/철회 및 해외 사업자 입점은 <a href="/glyAppInq"><span class="color-blue" name="appEntryInq">[SJLab FAQ > 문의하기]</span></a>로 요청해 주세요.</li>
                            <li>입점 거절 시 재입점 신청은 최소 6개월 후 가능합니다.</li>
                        </ul>
                        <div class="form-wrap mt-40">
                            <div class="form-write form-write--admit px-100 py-40">
                                <p class="form-write__tit">회사 정보</p>
                                <dl class="form-write__infos mt-40">
                                    <dt>
                                        <em>회사 이름</em><span class="essential">*</span>
                                    </dt>
                                    <dd>
                                        <div class="form-wrap">
                                            <div class="form-input">
                                                <input name="companyNm" type="text" class="width--420" />
                                                <label for="" class="d-block mt-5 font--14 color--gray">
                                                    ※ 사업자등록증의 법인명 또는 상호명을 입력하세요.
                                                </label>
                                            </div>
                                        </div>
                                    </dd>
                                    <dt class="mt-25">
                                        <em>사업자 등록번호</em><span class="essential">*</span>
                                    </dt>
                                    <dd class="mt-25">
                                        <div class="form-wrap form-row width--420">
                                            <div class="form-row flex-9">
                                                <div class="form-input flex-1 mr-5">
                                                    <input name="bNum1" maxlength="3" type="number" class="w-100" />
                                                </div>
                                                -
                                                <div class="form-input flex-1 ml-5 mr-5">
                                                    <input name="bNum2" maxlength="2" type="number" class="w-100" />
                                                </div>
                                                -
                                                <div class="form-input flex-1 ml-5">
                                                    <input name="bNum3" maxlength="5" type="number" class="w-100" />
                                                </div>
                                            </div>
                                            <div class="btn-wrap flex-3 ml-10">
                                                <button type="button" name="bsNumChk" class="btn btn--blue">사업자 확인</button>
                                            </div>
                                        </div>
                                        {{#if bnsChk.chk}}
                                            <div style="margin-top: 10px;">
                                                <em style="color: #FF0000;">{{bnsChk.message}}</em>
                                            </div>
                                        {{/if}}
                                    </dd>
                                    
                                    <dt class="mt-10">
                                        <em>홈페이지</em>
                                    </dt>
                                    <dd class="mt-10">
                                        <div class="form-wrap">
                                            <div class="form-input">
                                                <input name="homeUrl" type="text" class="width--420" />
                                            </div>
                                        </div>
                                    </dd>
                                </dl>
                            </div>
                            <div class="form-write form-write--admit px-100 py-40">
                                <p class="form-write__tit">영업담당자 정보</p>
                                <dl class="form-write__infos mt-40">
                                    <dt>
                                        <em>이        름</em><span class="essential">*</span>
                                    </dt>
                                    <dd>
                                        <div class="form-wrap">
                                            <div class="form-input">
                                                <input name="smaNm" type="text" class="width--420" />
                                            </div>
                                        </div>
                                    </dd>
                                    <dt class="mt-10">
                                        <em>전화번호</em><span class="essential">*</span>
                                    </dt>
                                    <dd class="mt-10">
                                        <div class="form-wrap form-row width--420">
                                            <div class="form-row">
                                                <div class="form-input flex-1 mr-5">
                                                    <input maxlength="3" name="smaPhone" type="number" class="w-100" />
                                                </div>
                                                -
                                                <div class="form-input flex-1 ml-5 mr-5">
                                                    <input maxlength="4" name="smaPhone" type="number" class="w-100" />
                                                </div>
                                                -
                                                <div class="form-input flex-1 ml-5">
                                                    <input maxlength="4" name="smaPhone" type="number" class="w-100" />
                                                </div>
                                            </div>
                                        </div>
                                    </dd>
                                    <dt class="mt-10">
                                        <em>이  메  일</em><span class="essential">*</span>
                                    </dt>
                                    <dd class="mt-10">
                                        <div class="form-wrap">
                                            <div class="form-input">
                                                <input name="smaEmail" type="email" class="width--420" />
                                            </div>
                                        </div>
                                    </dd>
                                </dl>
                            </div>
                            <div class="form-write form-write--admit px-100 py-40">
                                <p class="form-write__tit">갤러리 정보</p>
                                <dl class="form-write__infos mt-40">
                                    <dt>
                                        <em>갤러리 이름</em><span class="essential">*</span>
                                    </dt>
                                    <dd>
                                        <div class="form-wrap">
                                            <div class="form-input">
                                                <input name="glyNm" type="text" class="width--420" placeholder="※ 사업자등록증의 상호명과 같을 경우 동일한 이름을 적어주세요." />
                                            </div>
                                        </div>
                                    </dd>
                                    <dt class="mt-10">
                                        <em>갤러리 주소</em><span class="essential">*</span>
                                    </dt>
                                    <dd class="mt-10">
                                        <div class="form-wrap form-row flex-wrap width--420">
                                            <div class="form-input mr-5">
                                                <input name="zipCode" type="text" class="w-100" disabled="disabled" />
                                            </div>
                                            <div class="btn-wrap ml-10">
                                                <button type="button" class="btn btn--blue popup" data-id="addrs-Popup">사업자 확인</button>
                                            </div>
                                            <div class="form-input w-100 mt-10">
                                                <input name="address" type="text" class="w-100" disabled="disabled" />
                                            </div>
                                            <div class="form-input w-100 mt-10">
                                                <input name="detail" type="text" class="w-100" placeholder="상세주소" />
                                            </div>
                                        </div>
                                    </dd>

                                    <div style="opacity: 0.4;">
                                        <dt class="mt-10">
                                            <em class="somthingDisabled">소장작품 설명</em><span class="essential somthingDisabled">*</span>
                                        </dt>
                                        <dd class="mt-10">
                                            <div class="form-wrap">
                                                <div class="form-textarea">
                                                    <textarea disabled name="" id="" class="w-100 somthingDisabled" placeholder="※ 주로다루는 작품(Fine Art, 유화,수체화,일러스트, 디지털 아트, 카툰 등), 소장 작품의 수, 대표하는 장르 등 적어주세요."></textarea>
                                                </div>
                                            </div>
                                        </dd>
                                        <dt class="mt-10">
                                            <em class="somthingDisabled">대표 작품</em><span class="essential somthingDisabled">*</span>
                                        </dt>
                                        <dd class="mt-10">
                                            <div class="d-flex flex-wrap align-center">
                                                <a href="/uploadRepWork"><button type="button" class="btn btn--blue col-3 somthingDisabledBackground" disabled>대표 작품 올리기</button></a>
                                                <p class="ml-10 font-13 somthingDisabled">선택된 파일이 없습니다.</p>
                                                <p class="w-100 mt-10 font-13 fontW-500 color-blue somthingDisabled">
                                                    *대표하는 작가의 작품을 올려주세요 (최소 다른 3명의 작가의 작품)
                                                </p>
                                                <p class="w-100 mt-10 font-13 fontW-500 color-blue somthingDisabled">
                                                    *작품을 볼 수 있는 홈페이지나 다른 URL주소가  있다면 소장작품 설명 입력창에 남겨주세요
                                                </p>
                                            </div>
                                        </dd>
                                    </div> 

                                </dl>
                            </div>
                            <div class="form-write form-write--admit px-100 py-40">
                                <p class="form-write__tit">개인정보 수집 및 이용 동의</p>
                                <div class="table-wrap mt-50">
                                    <p class="table-capt font-12">㈜SJLab는 개인정보보호법, 정보통신망 이용촉진 및 정보보호 등에 관한 법률 등 관련 법령상의 개인정보보호 규정을 준수하며, 판매자님이 입점신청 시 필요한 최소한의 개인 정보를 수집합니다.</p>
                                    <table class="table-basic table-cols mt-5">
                                        <caption>입점신청 / 개인정보 수집 및 이용 동의 테이블</caption>
                                        <colgroup>
                                            <col style="width:33.3%">
                                            <col style="width:33.3%">
                                            <col style="width:auto">
                                        </colgroup>
                                        <thead>
                                            <tr>
                                                <th scope="col">목  적 </th>
                                                <th scope="col">항  목</th>
                                                <th scope="col">보 유 기 간</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td>판매자 식별, 입점 검토, 공지사항의 전달</td>
                                                <td>영업담당자의 이름/전화번호/이메일</td>
                                                <td>입점 처리기간이 종료되는 시점</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="btn-wrap mt-50 ta-c">
                                    <button type="button" name="bnsSubmit" class="btn btn--blue">입점 신청 완료</button>
                                </div>
                                <div class="betaVersionDiv">
                                    <ul>
                                        <li class="betaVersion">· 현재 베타 버젼으로 서비스 운영 중입니다.</li>
                                        <li class="betaVersion">· 갤러리 및 사업장 기본 정보를 입력하여 신청해 주시면 임시 비밀번호가 발급됩니다.</li>
                                        <li class="betaVersion">· 베타버젼 서비스 종료 후 본 서비스의 이용을 위해 입점신청을 완료해야 합니다.</li>
                                    </ul>
                                </div>
                            </div>
                            <div class="form-write form-write--admit px-100 py-40">
                                <ul class="lists lists-dot lists-dot--big p-0">
                                    <li>모든 등록 건은 담당자가 확인하여 이메일이나 전화로 회신드리오니, 중복 등록에 유의하여 주시기 바랍니다. </li>
                                    <li>용량이 큰 자료는 파일첨부나 이메일 수신이 불가합니다. 포털사이트/ 웹하드 공유 시스템을 이용하시기 바랍니다. </li>
                                    <li>파일명이 한글/영문/숫자를 제외한 특수문자 및 공백, 다른 나라 언어가 있을 경우 첨부되지 않으니 주의하시기 바랍니다. </li>
                                    <li>갤러리 정보를 상세하게 입력하셔야 빠른 처리가 가능하며, 단순 입점 방식에 대한 문의는 답변드리지 않습니다. </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        {{> footer}}
    </footer>

    {{> zipCode addr}}
    {{> utilsPopUp popup}}
</template>
