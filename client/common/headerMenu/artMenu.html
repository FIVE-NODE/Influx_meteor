<template name="artMenu">
    <!-- 원화 -->
    <article class="slideMenu-cont--artwork d-flex" id="clickToArtwork">

        <div class="artwork-tit col-2">
            <button name="art" type="button" class="artwork-tit__btn is-active" data-id="slideMenu-artwork-cont01">원             화</button>
            <button name="dtp" type="button" class="artwork-tit__btn" data-id="slideMenu-artwork-cont02">디지털 판화</button>
        </div>

        <div class="artwork-wrap col-10 d-flex is-open" id="slideMenu-artwork-cont01">
            <div class="artwork-group col-10">
                <div class="artwork-list">
                    <p class="artwork-list__tit">가 격(단위 만원)</p>
                    {{#each priceOgPrt}}
                        <div class="artwork-item">
                            <div class="form-input form-radio  form-row">
                                <input value="ARTWORK_PRICE-{{code}}" type="radio" class="form-radio__input" name="chk" id="radio-artwork--price{{code}}" />
                                <span class="form-radio__span"></span>
                                <label for="radio-artwork--price{{code}}" class="form-radio__label">{{name}}</label>
                            </div>
                        </div>
                    {{/each}}
                </div>
                <div class="artwork-list">
                    <p class="artwork-list__tit">미디엄(Medium)</p>
                    {{#each medium}}
                        <div class="artwork-item">
                            <div class="form-input form-check  form-row">
                                <input value="MEDIUM-{{code}}" name="chk" type="checkbox" class="form-check__input" id="check-artwork-medium{{code}}" />
                                <span class="form-check__span"></span>
                                <label for="check-artwork-medium{{code}}" class="form-check__label">{{name}}</label>
                            </div>
                        </div>
                    {{/each}}
                </div>
                <div class="artwork-list">
                    <p class="artwork-list__tit">제작연도 </p>
                    {{#each mkyy}}
                        <div class="artwork-item">
                            <div class="form-input form-check  form-row">
                                <input value="MK_YEAR-{{code}}" name="chk" type="checkbox" class="form-check__input" id="check-artwork-year{{code}}" />
                                <span class="form-check__span"></span>
                                <label for="check-artwork-year{{code}}" class="form-check__label">{{name}}</label>
                            </div>
                        </div>
                    {{/each}}
                </div>
                <div class="artwork-list">
                    <p class="artwork-list__tit">스타일1(Styles1) </p>
                    {{#each style1}}
                        <div class="artwork-item">
                            <div class="form-input form-check  form-row">
                                <input value="STYLE_1-{{code}}" name="chk" type="checkbox" class="form-check__input" id="check-artwork-style-01-{{code}}" />
                                <span class="form-check__span"></span>
                                <label for="check-artwork-style-01-{{code}}" class="form-check__label">{{name}}</label>
                            </div>
                        </div>
                    {{/each}}
                </div>
                <div class="artwork-list">
                    <p class="artwork-list__tit">스타일2(Styles1) </p>
                    {{#each style2}}
                        <div class="artwork-item">
                            <div class="form-input form-check  form-row">
                                <input value="STYLE_2-{{code}}" name="chk" type="checkbox" class="form-check__input" id="check-artwork-style-02-{{code}}" />
                                <span class="form-check__span"></span>
                                <label for="check-artwork-style-02-{{code}}" class="form-check__label">{{name}}</label>
                            </div>
                        </div>
                    {{/each}}
                </div>
                <div class="artwork-list">
                    <p class="artwork-list__tit">재료(Materials) </p>
                    {{#each materials}}
                        <div class="artwork-item">
                            <div class="form-input form-check  form-row">
                                <input value="MATERIAL-{{code}}" name="chk" type="checkbox" class="form-check__input" id="check-artwork-material{{code}}" />
                                <span class="form-check__span"></span>
                                <label for="check-artwork-material{{code}}" class="form-check__label">{{name}}</label>
                            </div>
                        </div>
                    {{/each}}
                </div>
                <p class="artwork-caution color--sea">*원하는 조건 선택 후 (가격외 복수 선택 가능)  검색 버튼  클릭해 주세요</p>
            </div>
            <div class="artwork-submit col-2">
                <button name="schBtn" type="button" class="slideMenu-sch" title="slidemenu 검색">
                    <img src="/image/common/icon/icon-search.png" alt="">
                </button>
                <button name="allCancel" type="button" class="check-reset" title="전체선택 해제">
                    <img src="/image/common/icon/icon-reset.png" alt="">
                    <span>전체선택 해제</span>
                </button>
            </div>
      </div>
    <!-- 원화 끝 -->

    <!-- 디지털 판화 -->
    <div class="artwork-wrap col-10 d-flex" id="slideMenu-artwork-cont02">
        <div class="artwork-group col-10">
            <div class="artwork-list">
                <p class="artwork-list__tit">가 격(단위 만원)</p>
                {{#each priceOgDtp}}
                    <div class="artwork-item">
                        <div class="form-input form-radio  form-row">
                            <input value="ARTWORK_PRICE-{{code}}" type="radio" class="form-radio__input" name="chk" id="radio-artwork__degital--price{{code}}" />
                            <span class="form-radio__span"></span>
                            <label for="radio-artwork__degital--price{{code}}" class="form-radio__label">{{name}}</label>
                        </div>
                    </div>
                {{/each}}
            </div>
            <div class="artwork-list">
                <p class="artwork-list__tit">베이스(Base)</p>
                {{#each base}}
                    <div class="artwork-item">
                        <div class="form-input form-check  form-row">
                            <input value="BASE-{{code}}" name="chk" type="checkbox" class="form-check__input" id="check-artwork-base{{code}}" />
                            <span class="form-check__span"></span>
                            <label for="check-artwork-base{{code}}" class="form-check__label">{{name}}</label>
                        </div>
                    </div>
                {{/each}}
            </div>
            <div class="artwork-list">
                <p class="artwork-list__tit">스타일1(Styles1) </p>
                {{#each style1}}
                    <div class="artwork-item">
                        <div class="form-input form-check  form-row">
                            <input value="STYLE_1-{{code}}" name="chk" type="checkbox" class="form-check__input" id="check-artwork-style-dtp-01-{{code}}" />
                            <span class="form-check__span"></span>
                            <label for="check-artwork-style-01-{{code}}" class="form-check__label">{{name}}</label>
                        </div>
                    </div>
                {{/each}}
            </div>
            <div class="artwork-list">
                <p class="artwork-list__tit">스타일2(Styles1) </p>
                {{#each style2}}
                    <div class="artwork-item">
                        <div class="form-input form-check  form-row">
                            <input value="STYLE_2-{{code}}" name="chk" type="checkbox" class="form-check__input" id="check-artwork-style-dtp-02-{{code}}" />
                            <span class="form-check__span"></span>
                            <label for="check-artwork-style-02-{{code}}" class="form-check__label">{{name}}</label>
                        </div>
                    </div>
                {{/each}}
        </div>
            <p class="artwork-caution color--sea">*원하는 조건 선택 후 (가격외 복수 선택 가능)  검색 버튼  클릭해 주세요</p>
        </div>
        <div class="artwork-submit col-2">
            <button name="schBtn" type="button" class="slideMenu-sch" title="slidemenu 검색">
                <img src="/image/common/icon/icon-search.png" alt="">
            </button>
            <button name="allCancel" type="button" class="check-reset" title="전체선택 해제">
                <img src="/image/common/icon/icon-reset.png" alt="">
                <span>전체선택 해제</span>
            </button>
        </div>
    </div>
</article>
<!-- 디지털 판화 끝 -->
</template>
