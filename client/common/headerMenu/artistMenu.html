<template name="artistMenu">
    <article class="slideMenu-cont--artist d-flex" id="clickToArtist" style="margin-top:10px;">
        <div class="artwork-tit col-2">
            <p class="artwork-tit__p">작 가</p>
        </div>
        <div class="artwork-wrap  is-open col-10 d-flex">
            <div class="artwork-box col-7">
                <div class="artwork-group justify-around">
                    <div class="artwork-list">
                        <p class="artwork-list__tit">스타일1(Styles1) </p>
                        {{#each style1}}
                        <div class="artwork-item">
                            <div class="form-input form-check  form-row">
                                <input value="STYLE_1-{{code}}" name="artistChk" type="checkbox" class="form-check__input" id="check-artist-style-01-{{code}}" />
                                <span class="form-check__span"></span>
                                <label for="check-artist-style-01-{{code}}" class="form-check__label">{{name}}</label>
                            </div>
                        </div>
                        {{/each}}
                    </div>
                    <div class="artwork-list">
                        <p class="artwork-list__tit">스타일2(Styles1) </p>
                        {{#each style2}}
                        <div class="artwork-item">
                            <div class="form-input form-check  form-row">
                                <input value="STYLE_2-{{code}}" name="artistChk" type="checkbox" class="form-check__input" id="check-artist-style-02-{{code}}" />
                                <span class="form-check__span"></span>
                                <label for="check-artist-style-02-{{code}}" class="form-check__label">{{name}}</label>
                            </div>
                        </div>
                        {{/each}}
                    </div>
                    <div class="artwork-list">
                        <p class="artwork-list__tit">제작연도 </p>
                        {{#each mkyy}}
                            <div class="artwork-item">
                                <div class="form-input form-check  form-row">
                                    <input value="MK_YEAR-{{code}}" name="artistChk" type="checkbox" class="form-check__input" id="check-artist-year{{code}}" />
                                    <span class="form-check__span"></span>
                                    <label for="check-artist-year{{code}}" class="form-check__label">{{name}}</label>
                                </div>
                            </div>
                        {{/each}}
                    </div>
                    <p class="artwork-caution color--sea">*원하는 조건 선택 후 (가격외 복수 선택 가능)  검색 버튼  클릭해 주세요</p>
                </div>
            </div>
            <div class="artwork-submit col-5">
                <div class="form-sch">
                    <div class="form-input">
                        <input type="text" name="menuAtstNm" class="form-sch__input" placeholder="작가 이름 입력" />
                    </div>
                    <button type="button" name="schBtn" class="slideMenu-sch" title="slidemenu 검색">
                        <img src="/image/common/icon/icon-search.png" alt="">
                    </button>
                </div>
                <button type="button" name="allCancel" class="check-reset" title="전체선택 해제">
                    <img src="/image/common/icon/icon-reset.png" alt="">
                    <span>전체선택 해제</span>
                </button>
            </div>
        </div>
    </article>
</template>
