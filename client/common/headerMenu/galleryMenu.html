<template name="galleryMenu">
    <article class="slideMenu-cont--gallery d-flex" id="clickToGallery" style="margin-top:10px;">
        <div class="artwork-tit col-2">
            <p class="artwork-tit__p">갤 러 리</p>
        </div>
        <div class="artwork-wrap  is-open col-10 d-flex">
            <div class="artwork-group col-7 justify-around">
                <div class="artwork-list col-6 ml-auto artwork-list--area">
                    <p class="artwork-list__tit">지역별</p>
                    {{#each region}}
                        <div class="artwork-item">
                            <div class="form-input form-check  form-row">
                                <input value="REGION-{{code}}-{{name}}" name="glryChk" type="checkbox" class="form-check__input" id="check-gallery__area{{code}}" />
                                <span class="form-check__span"></span>
                                <label for="check-gallery__area{{code}}" class="form-check__label">{{name}}</label>
                            </div>
                        </div>
                    {{/each}}
                </div>
                <div class="artwork-list col-3 ml-auto">
                    <p class="artwork-list__tit">전시회 및 이벤트</p>
                    {{#each evnt}}
                        <div class="artwork-item">
                            <div class="form-input form-check  form-row">
                                <input value="EVNT-{{code}}" name="glryChk" type="checkbox" class="form-check__input" id="check-gallery__event{{code}}" />
                                <span class="form-check__span"></span>
                                <label for="check-gallery__event{{code}}" class="form-check__label">{{name}}</label>
                            </div>
                        </div>
                    {{/each}}
                </div>
                <p class="artwork-caution color--sea">*원하는 조건 선택 후 (가격외 복수 선택 가능)  검색 버튼  클릭해 주세요</p>
            </div>
            <div class="artwork-submit col-5">
                <div class="form-sch">
                    <div class="form-input">
                        <input type="text" name="glryNm" class="form-sch__input" placeholder="갤러리 이름 입력" />
                    </div>
                    <button name="schBtn" type="button" class="slideMenu-sch" title="slidemenu 검색">
                        <img src="/image/common/icon/icon-search.png" alt="">
                    </button>
                </div>
                <button name="allCancel" type="button" class="check-reset" title="전체선택 해제">
                    <img src="/image/common/icon/icon-reset.png" alt="">
                    <span>전체선택 해제</span>
                </button>
            </div>
        </div>
    </article>
</template>
