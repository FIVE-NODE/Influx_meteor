<template name="zOne">
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <h3 class="subTit">
                    <span class="subTit__inner">
                        회사소개
                    </span>
                </h3>
                <div class="sub-content">
                    <div class="sub-content__intro">
                        <p class="mt-60 font-40 fontW-b color--txt">
                            대한민국 미술문화 대중화를 선도하는 회사입니다. 
                        </p>
                        <p class="mt-60 font-24 fontW-b color--txt">
                            더 많은 사람들의 위한, 더 많은 아티스트를 위한, 미술품의 대중화를 이끌 수 있는 마켓을 만들고 이끌고자 합니다. 
                        </p>
                        <div class="intro-wrap mt-60">
                            <div class="intro-list">
                                <div class="intro-item intro-item--story01">
                                    <p class="intro-item__tit">Our Story</p>
                                    <p class="intro-item__cont">
                                        새로운 세대 MZ를 비롯하요 모든 세대가 쉽게 미술품을 접할 수 있는 새로운 마켓의 마련하주고 아티스티의 미술 작품의 가치를 극대화 하여 아티스트의 활동과 신인 아티스트의 육성을 도모하고 있습니다. 
                                    </p>
                                </div>
                                <div class="intro-item intro-item--story02">
                                    <p class="intro-item__tit">Our Story</p>
                                    <p class="intro-item__cont">
                                        새로운 시대에 맞는 마켓을 위해, 문화예술의 대중화, 문화예술의 일상화, 문화예술의 활성화를 목표를 가지고 꾸준한 고객과 아티스트들과 꾸준히 소통하고 예술문화를 발전시킬수 있는데 꾸준히 노력하겠습니다. 
                                    </p>
                                </div>
                                <div class="intro-item intro-item--business">
                                    <p class="intro-item__tit">Our Business</p>
                                    <p class="intro-item__cont">
                                        전통적 미디엄의 아티스트 더불어 뉴 미디어 작가들의 참여할 수 있는 장을 만들어 다양한 미술문화의 활성화 뿐만아니라 저희 비즈니스의 확장을 꽤 하고 있습니다. 
                                    </p>
                                </div>
                                <div class="intro-item intro-item--heritage">
                                    <p class="intro-item__tit">Our Heritage</p>
                                    <p class="intro-item__cont">
                                        새로운 미술 시장 새로운 마켓의 장을 열어 미술품의 대중화로 더 많은 사람 더 많은 작가가 만날 미술품의 대중화를 이끌수 이쓴 새로운 미술 시장의 메켓을 이끌어 새로운 역사를 쓰고 있습니다.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        {{> footer}}
    </footer>
</template>
