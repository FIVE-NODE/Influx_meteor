<template name="searchFilter">
    {{#if renderFlag}}
    <div class="lnb-wrap">
        <button type="button" class="lnb-tit is-close">
            아티스트
            <span></span>
        </button>
        <div class="lnb-cont lnb-cont--artist">
            <div class="lnb-cont__list">
                {{#if rprsnAtst}}
                    {{#each rprsnAtst}}
                        <button value="{{this}}" name="rprsnAtst" type="button" class="">{{this}}</button>
                    {{/each}}
                {{/if}}
            </div>
            <div class="lnb-cont__link">
                <a href="">더보기</a>
                <button  name="atstAllDeSelect" type="button">선택해제</button>
            </div>
        </div>

        <!-- 스타일 -->
        <button type="button" class="lnb-tit is-close">
            스타일
            <span></span>
        </button>
        <div class="lnb-cont lnb-cont--style">
            <div class="lnb-cont__list">
                <div class="form-wrap">
                    {{#each style}}
                        <div class="form-check form-row">
                            <input value="STYLE-{{code}}" name="style" type="checkbox" class="form-check__input" id="check-lnb--style{{code}}">
                            <label for="check-lnb--style{{code}}">{{name}}</label>
                        </div>
                    {{/each}}
                </div>
            </div>
            <div class="lnb-cont__link">
                <a href="">더보기</a>
                <button name="styleAllDeSelect" type="button">선택해제</button>
            </div>
        </div>

        <!-- 가격(단위, 만원) -->
        <button type="button" class="lnb-tit is-close">
            가격(단위, 만원)
            <span></span>
        </button>
        <div class="lnb-cont lnb-cont--price">
            <div class="lnb-cont__list">
                <div class="form-wrap">
                    {{#each price}}
                        <div class="form-radio form-row">
                            <input value="PRICE-{{code}}" type="radio" name="product-price" class="form-radio__input" id="radio-lnb--price{{code}}">
                            <label for="radio-lnb--price{{code}}">{{name}}</label>
                        </div>
                    {{/each}}
                </div>
            </div>
            <div class="lnb-cont__link">
                <a href="">더보기</a>
                <button name="priceAllDeSelect" type="button">선택해제</button>
            </div>
        </div>

        <!-- 재료  -->
        <button type="button" class="lnb-tit is-close">
            재료
            <span></span>
        </button>
        <div class="lnb-cont lnb-cont--material">
            <div class="lnb-cont__list">
                <div class="form-wrap">
                    {{#each materials}}
                        <div class="form-check form-row">
                            <input value="METERIALS-{{code}}" name="materials" type="checkbox" class="form-check__input" id="check-lnb--material{{code}}">
                            <label for="check-lnb--material{{code}}">{{name}}</label>
                        </div>
                    {{/each}}
                </div>
            </div>
            <div class="lnb-cont__link">
                <a href="">더보기</a>
                <button name="materialsAllDeSelect" type="button">선택해제</button>
            </div>
        </div>

        <div class="btn-wrap border-top pt-30 ta-r">
            <button type="button" class="uncheck-all">전체 선택 해제</button>
        </div>
    </div>
    {{/if}}
</template>
