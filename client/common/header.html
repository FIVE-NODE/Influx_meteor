<template name="header">
    <!-- <link rel="stylesheet" href="/css/sub.css"> -->
    <section class="header__inner" id="headerPs">
        {{#if quickChk}}
        <div class="header__top">
            <div class="header__top__inner">
                <h1 class="header-logo">
                    <a href="/aOne">
                        <img style="max-width: 100px;" src="/image/common/img-logo-main.png" alt="SJLab">
                    </a>
                </h1>
                <div class="slideMenu ml-100">
                    <button name="artMenu" data-id="clickToArtwork" type="button" class="slideMenu__btn" title="ARTWORK 슬라이드 메뉴 열림">ARTWORK</button>
                    <button name="galleryMenu" data-id="clickToGallery" type="button" class="slideMenu__btn" title="GALLERY 슬라이드 메뉴 열림">GALLERY</button>
                    <button name="artistMenu" data-id="clickToArtist" type="button" class="slideMenu__btn" title="ARTIST 슬라이드 메뉴 열림">ARTIST</button>
                    <button name="artMenu" data-id="clickToArtwork" type="button" class="slideMenu-sch slideMenu__btn" title="ARTIST 슬라이드 메뉴 열림">
                        <img src="/image/common/icon/icon-search.png" alt="">
                    </button>
                    <div class="slideMenu-cont-wrap" id="slideMenus">
                        <div class="slideMenu-cont">
                            {{> artMenu}}
                            {{> artistMenu}}
                            {{> galleryMenu}}
                        </div>
                    </div>
                </div>
                <div class="btn-mobile">
                    <button type="button">
                        <svg viewBox="0 0 18 18" fill="currentColor" style="width: 100%;"><path fill-rule="evenodd" clip-rule="evenodd" d="M3 2.99998H15.026V3.99998H3V2.99998ZM3 8.51199H15.026V9.49999H3V8.51199ZM3 13.996H15.026V15H3V13.996Z"></path></svg>
                    </button>
                </div>
                <div class="sideMenu-mo">
                    <button type="button" class="btn-sideMenu__close">
                        <svg viewBox="0 0 18 18" fill="currentColor" style="width: 100%; height: 100%;"><path fill-rule="evenodd" clip-rule="evenodd" d="M9.88006 9.00001L14.4401 13.56L13.5601 14.44L9.00006 9.88001L4.44006 14.44L3.56006 13.56L8.12006 9.00001L3.56006 4.44001L4.44006 3.56001L9.00006 8.12001L13.5601 3.56001L14.4401 4.44001L9.88006 9.00001Z"></path></svg>
                    </button>
                    <div class="btn-sideMenu__list">
                        <div class="btn-sideMenu__box">
                            <a href="" class="is-active sjLab">SJ Lab</a>
                            <a href="">원화</a>
                            <a href="">디지털에디션 판화</a>
                            <a href="">큐레이터Pick</a>
                            <a href="">NEW!! 입점작품</a>
                            <a href="">갤러리</a>
                            <a href="">전시회/이벤트</a>
                            <a href="">유화</a>
                            <a href="">카툰/일러스트</a>
                            <a href="">20만원 미만(디지털)</a>
                            <a href="">500만원 이상(원화)</a>
                        </div>
                        <div class="btn-sideMenu__box">
                            <a href="" class="is-active">알림</a>
                            <a href="" class="is-active">MY페이지</a>
                        </div>
                        <div class="btn-sideMenu__box">
                            <a href="">로그인</a>
                            <a href="">회원가입</a>
                        </div>
                    </div>
                </div>
                <nav>
                    <button type="button" name="headerBtnMenu" value="alarm" class="nav-btn nav-btn--alarm">
                        
                        <span class="nav-btn__img">
                            {{#if loginChk}}
                                <span class="secondary-nav__items-count notification-badge items js-wishlist-number">{{ntcnCount}}</span>
                            {{/if}}
                            <img src="/image/common/icon/icon-bell.png" alt="">
                        </span>
                        <span class="nav-btn__txt">알 림</span>
                    </button>

                    {{#if userChk}}
                        <button value="/interestAtwrk" name="headerBtnMenu"  type="button" class="nav-btn nav-btn--favor">
                            <span class="nav-btn__img">
                                <span class="secondary-nav__items-count notification-badge items js-wishlist-number">{{likeCount}}</span>
                                <img src="/image/common/icon/icon-heart.png" alt="">
                            </span>
                            <span class="nav-btn__txt">관 심</span>
                        </button>
                        <button value="/userCart" name="headerBtnMenu" type="button" class="nav-btn nav-btn--basket">
                            <span class="nav-btn__img">
                                <span class="secondary-nav__items-count notification-badge items js-wishlist-number">{{cartCount}}</span>
                                <img src="/image/common/icon/icon-shopping-cart.png" alt="">
                            </span>
                            <span class="nav-btn__txt">장바구니</span>
                        </button>
                    {{else}}
                        
                    {{/if}}

                    <button data-id="myPageSimple_popup" type="button" name="myPage" class="nav-btn nav-btn--mypage popup-mypage">
                        <span class="nav-btn__img">
                            <img src="/image/common/icon/icon-user.png" alt="">
                        </span>
                        <span class="nav-btn__txt">MY페이지</span>
                    </button>
                </nav>
            </div>
        </div> <!-- /header__top -->
        {{/if}}

        {{#if midHeader}}
        <div class="header__mid">
            <div class="header__mid__inner">
                {{#if glryMidHeaderChk}}

                <div class="header__mid-info">
                    <h3 class="header__mid-info__tit">MY 페이지</h3>
                    {{#with glryInfo}}
                        <span class="header__mid-info__img">
                            <img class="glry-myPage-glryImg" src="{{glryImage}}" alt="">
                        </span>
                        <p class="header__mid-info__name">{{glryNm}}</p>
                        <p class="header__mid-info__capt">(회원정보변경)</p>
                    {{/with}}
                </div>

                <div class="header__mid-menu">
                    <a href="" name="glryMenu" id="/glryAtwrks" class="{{pageChk 'glryAtwrks'}}">
                        <span class="img-wrap">
                            <img src="/image/sub/icon/icon-header__mid--admit.png" alt="">
                        </span>
                        <span class="txt-wrap">작품등록</span>
                    </a>
                    <a href="" id="/myPageSelling" name="glryMenu" class="{{pageChk 'myPageSelling'}}">
                        <span class="img-wrap">
                            <img src="/image/sub/icon/icon-header__mid--sailing.png" alt="">
                        </span>
                        <span class="txt-wrap">판매중 작품</span>
                    </a>
                    <a href="" id="/eventsCrList" name="glryMenu" class="{{pageChk 'eventsCrList'}}">
                        <span class="img-wrap">
                            <img src="/image/sub/icon/icon-header__mid--event.png" alt="">
                        </span>
                        <span class="txt-wrap">전시 및 행사 등록</span>
                    </a>
                    <a href="" name="glryMenu" id="" class="{{pageChk ''}}">
                        <span class="img-wrap">
                            <img src="/image/sub/icon/icon-header__mid--bidding.png" alt="">
                        </span>
                        <span class="txt-wrap">비딩관리</span>
                    </a>
                    <a href="" id="/bMsgManage" name="glryMenu" class="{{pageChk 'bMsgManage'}}">
                        <span class="img-wrap">
                            <img src="/image/common/icon/icon-header__mid--mail.png" alt="">
                        </span>
                        <span class="txt-wrap">메세지 관리</span>
                    </a>
                    <a href="" id="" name="glryMenu" class="{{pageChk ''}}">
                        <span class="img-wrap">
                            <img src="/image/common/icon/icon-header__mid--delivery.png" alt="">
                        </span>
                        <span class="txt-wrap">주문배송내역</span>
                    </a>
                    <a href="" id="" name="glryMenu" class="{{pageChk ''}}">
                        <span class="img-wrap">
                            <img src="/image/sub/icon/icon-header__mid--pencil.png" alt="">
                        </span>
                        <span class="txt-wrap">정산내역</span>
                    </a>
                </div>

                {{else}}
                
                <div class="header__mid-info">
                    <h3 class="header__mid-info__tit">MY 페이지</h3>
                    <span class="header__mid-info__img">
                        <img style="max-width: 100px;" class="" src="{{pfImgChk}}" alt="">
                    </span>
                    <p class="header__mid-info__name">{{nmChk}} 님</p>
                    <p class="header__mid-info__capt">(회원정보변경)</p>
                </div>
                <div class="header__mid-menu">
                    <a href="/interestAtwrk" class="{{pageChk 'interestAtwrk'}}">
                        <span class="img-wrap">
                            <img src="/image/common/icon/icon-header__mid--heart.png" alt="">
                        </span>
                        <span class="txt-wrap">관심 리스트</span>
                    </a>
                    <a href="/userCart" class="{{pageChk 'userCart'}}">
                        <span class="img-wrap">
                            <img src="/image/common/icon/icon-header__mid--cart.png" alt="">
                        </span>
                        <span class="txt-wrap">장바구니</span>
                    </a>
                    <a href="/msgManage" class="{{pageChk 'msgManage'}}">
                        <span class="img-wrap">
                            <img src="/image/common/icon/icon-header__mid--mail.png" alt="">
                        </span>
                        <span class="txt-wrap">메세지 관리</span>
                    </a>
                    <a href="/purchaseList" class="{{pageChk 'purchaseList'}}">
                        <span class="img-wrap">
                            <img src="/image/common/icon/icon-header__mid--delivery.png" alt="">
                        </span>
                        <span class="txt-wrap">주문배송내역</span>
                    </a>
                    <a href="/myCollection" id="" class="{{pageChk 'myCollection'}}">
                        <span class="img-wrap">
                            <img src="/image/common/icon/icon-header__mid--pic.png" alt="">
                        </span>
                        <span class="txt-wrap">MY 컬렉션</span>
                    </a>
                </div>
                {{/if}}
            </div>
        </div>
        {{/if}}

        <!-- /header__mid -->
        {{#if quickChk}}
        <div class="header__bottom">
            <div class="header__bottom__inner">
                <div class="gnb swiper">
                    {{#if quickMenuChk}}
                    <div class="swiper-wrapper">
                        {{#each quickMu}}
                        <div class="swiper-slide">
                            <a href="{{lnkUrl}}" class="testsss" name="quickMu">
                                <span class="gnb__img">
                                    <img src="{{image}}" alt="">
                                </span>
                                <h2>{{qMenuNm}}</h2>
                            </a>
                        </div>
                        {{/each}}
                    </div>
                    {{/if}}
                </div>
                {{#unless currentUser}}
                    <div class="bradCrumb">
                        <a href="/login">로 그 인 </a>
                        <a href="/signUp">회원가입</a>
                    </div>
                {{/unless}}
            </div>
        </div> <!-- /header__bottom -->
        {{/if}}
    </section>
    {{> myPageSimple}}
</template>
