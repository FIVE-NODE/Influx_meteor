<template name="aOne">
    <script type="text/javascript" src="/libs/common.js"></script>
    <section class="container" id="move">
        <div class="content">
            <article class="slide-list slide-list--product">
                <div class="slide-wrap slide-wrap--banr">
                    <div class="swiper">
                        <div class="swiper-wrapper">
                            {{#if banr}}
                                {{#each banr}}
                                    <div class="swiper-slide">
                                        <div class="banner-item">
                                            <a href="">
                                                <span class="banner-item__img">
                                                    <!-- <div id="loadings" class='testSample sampleBaner'> -->
                                                        <!-- /image/common/simpleLoading.gif -->
                                                    <img
                                                        src=""
                                                        data-src="{{image}}"
                                                        class="testSample sampleBaner lazyload"
                                                        alt=""
                                                    >
                                                    <!-- </div> -->
                                                </span>
                                                <span class="banner-item__txt">
                                                    <strong>{{title}}</strong>
                                                    <b>{{addInput1}}</b>
                                                    <en>{{addInput2}}</en>
                                                </span>
                                            </a>
                                        </div>
                                    </div>
                                {{/each}}
                            {{else}}
                                {{{loadingScr "sampleBaner"}}}
                            {{/if}}
                        </div>
                    </div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
            </article>
            <div class="content__inner">
                <article class="slide-list slide-list--product">
                    <div class="slide-list__tit">
                        <a href="curatorPick">
                            <p>큐레이터 Pick !!!</p>
                        </a>
                        <div class="btn-wrap slide-list--tab">
                            <button type="button" name="pickOg" class="is-active">원 화</button>
                            <button type="button" name="pickDt">디지털 에디션 판화</button>
                            <button type="button" name="pickAtst">작 가</button>
                        </div>
                    </div>
                    <div class="slide-wrap slide-wrap--curator">
                        <!-- 큐레이터 Pick 로직 -->
                        <div class="swiper">
                            <div class="swiper-wrapper">
                                {{#if pick}}
                                    {{#each pick}}
                                        <div class="swiper-slide">
                                            <a class="" href="" name="atDetail" value="{{atwrkID}}">
                                                <img src="{{testImage}}" class="sampleTest" >
                                            </a>
                                            <div class="btn-wrap btn-slide--check">
                                                <button name="shBasket" value="{{_id}}" type="button" title="장바구니 넣기">
                                                    <img src="/image/main/icon/icon-cart.svg" alt="">
                                                </button>
                                                {{#if chkDtp}}
                                                    <button name="goodBtn" value="{{_id}}" type="button" title="찜하기">
                                                        <img src="/image/main/icon/icon-heart.svg" alt="">
                                                    </button>
                                                {{else}}
                                                    <button value="dtPrt" name="goodBtn" type="button" title="찜하기">
                                                        <img src="/image/main/icon/icon-heart.svg" alt="">
                                                    </button>
                                                {{/if}}
                                            </div>
                                            <p class="swiper-slide__tit">{{atstNm}}</p>
                                            <p class="swiper-slide__txt">
                                                <em>{{atwrkNm}}, {{wSize}}x{{hSize}}{{#if chkDtp}}, {{codeToName metRias "MATERIAL"}}{{/if}}</em>
                                                <em>{{pick.glry.glryNm}}</em>
                                                <em>{{pric}} 원</em>
                                            </p>
                                        </div>
                                    {{/each}}
                                {{else}}
                                    {{#if dataSetChk pick}}
                                        {{{loadingScr "sampleTest"}}}
                                    {{else}}
                                    {{/if}}
                                {{/if}}
                            </div>
                        </div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>
                    </div>
                    <!-- 입점 작품 -->
                    <div class="slide-list__tit">
                        <a href="newEntryAtwrk">
                            <p>NEW! 입점 작품</p>
                        </a>
                    </div>
                    <div class="slide-wrap slide-wrap--newProduct">
                        <div class="swiper">
                            <div class="swiper-wrapper">
                                {{#if atwrk}}
                                    {{#each atwrk}}
                                        <div class="swiper-slide">
                                            {{#each image}}
                                                {{#if mainImgChk rprsn}}
                                                    <a href="/atwrkDetail/{{../_id}}" name="atDetail">
                                                        <!-- /image/common/loading.gif -->
                                                        <img 
                                                            src=""
                                                            data-src="{{imgID}}"
                                                            class="testSample sampleTest lazyload"
                                                            alt=""
                                                        >
                                                        <!-- <img class="sampleTest" src="{{imgID}}" alt=""> -->
                                                    </a>
                                                {{/if}}
                                            {{/each}}
                                            <div class="btn-wrap btn-slide--check">
                                                <button name="shBasket" type="button" value="ogPrt" title="장바구니 넣기">
                                                    <img src="/image/main/icon/icon-cart.svg" alt="">
                                                </button>
                                                <button name="goodBtn" value="{{_id}}" type="button" title="찜하기">
                                                    <img src="/image/main/icon/icon-heart.svg" alt="">
                                                </button>
                                            </div>
                                            <p class="swiper-slide__tit">{{atstInfo.atstNm}}</p>
                                            <p class="swiper-slide__txt">
                                                <em>{{ogPrt.atwrkNm}}, {{ogPrt.wSize}}x{{ogPrt.hSize}}, {{codeToName ogPrt.metRias "MATERIAL"}}
                                                </em>
                                                <em>{{glry.glryNm}}</em>
                                                <em>{{ogPrt.pric}} 원</em>
                                            </p>
                                        </div>
                                    {{/each}}
                                {{else}}
                                    {{#if dataSetChk atwrk}}
                                        {{{loadingScr "sampleTest"}}}
                                    {{else}}
                                    {{/if}}
                                {{/if}}
                            </div>
                        </div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>
                    </div>
                    <!-- 디지털 판화 -->
                    <div class="slide-list__tit">
                        <a href="newEntryAtwrk">
                            <p>디지털 에디션 판화 </p>
                        </a>
                    </div>
                    <div class="slide-wrap slide-wrap--digital">
                        <div class="swiper">
                            <div class="swiper-wrapper">
                                {{#if dtpHome}}
                                    {{#each dtpHome}}
                                        <div class="swiper-slide">
                                            {{#each image}}
                                                {{#if mainImgChk rprsn}}
                                                    <a href="/atwrkDetail/{{../_id}}">
                                                        <!-- /image/common/loading.gif -->
                                                        <img 
                                                            src=""
                                                            data-src="{{imgID}}"
                                                            class="testSample sampleTest lazyload"
                                                            alt=""
                                                        >
                                                    </a>
                                                {{/if}}
                                            {{/each}}
                                            <div class="btn-wrap btn-slide--check">
                                                <button name="shBasket" type="button" value="dtPrt" title="장바구니 넣기">
                                                    <img src="/image/main/icon/icon-cart.svg" alt="">
                                                </button>
                                                <button value="dtPrt" name="goodBtn"  type="button" title="찜하기">
                                                    <img src="/image/main/icon/icon-heart.svg" alt="">
                                                </button>
                                            </div>
                                            <p class="swiper-slide__tit">{{atstInfo.atstNm}}</p>
                                            <p class="swiper-slide__txt">
                                                <em>{{dtPrt.atwrkNm}}, {{ogPrt.wSize}}x{{ogPrt.hSize}}, {{codeToName dtPrt.base "BASE"}}
                                                </em>
                                                <em>{{glry.glryNm}}</em>
                                                <em>{{dtPrt.mPric}} 원</em>
                                            </p>
                                        </div>
                                    {{/each}}
                                {{else}}
                                    {{{loadingScr "sampleTest"}}}
                                {{/if}}
                            </div>
                        </div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>
                    </div>
                    <div class="slide-list__tit">
                        <a href="originalAtwrk">
                            <p>원    화</p>
                        </a>
                    </div>
                    <div class="slide-wrap slide-wrap--original">
                        <div class="swiper">
                            <div class="swiper-wrapper">
                                {{#if ogHome}}
                                    {{#each ogHome}}
                                        <div class="swiper-slide">
                                            {{#each image}}
                                                {{#if mainImgChk rprsn}}
                                                    <a href="/atwrkDetail/{{../_id}}">
                                                        <!-- /image/common/loading.gif -->
                                                        <img 
                                                            src=""
                                                            data-src="{{imgID}}"
                                                            class="testSample sampleTest lazyload"
                                                            alt=""
                                                        >
                                                    </a>
                                                {{/if}}
                                            {{/each}}
                                            <div class="btn-wrap btn-slide--check">
                                                <button name="shBasket" type="button" value="ogPrt" title="장바구니 넣기">
                                                    <img src="/image/main/icon/icon-cart.svg" alt="">
                                                </button>
                                                <button name="goodBtn" type="button" title="찜하기">
                                                    <img src="/image/main/icon/icon-heart.svg" alt="">
                                                </button>
                                            </div>
                                            <p class="swiper-slide__tit">{{atstInfo.atstNm}}</p>
                                            <p class="swiper-slide__txt">
                                                <em>{{ogPrt.atwrkNm}}, {{ogPrt.wSize}}x{{ogPrt.hSize}}, {{codeToName ogPrt.metRias "MATERIAL"}}</em>
                                                <em>{{glry.glryNm}}</em>
                                                <em>{{ogPrt.pric}} 원</em>
                                            </p>
                                        </div>
                                    {{/each}}
                                {{else}}
                                    {{{loadingScr "sampleTest"}}}
                                {{/if}}
                            </div>
                        </div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>
                    </div>
                </article>
                <article class="slide-list slide-list--gallery">
                    <div class="slide-list__tit">
                        <a href="exhibitionEvnt">
                            <p>전 시 회 / 이 벤 트</p>
                        </a>
                    </div>
                    <div class="slide-wrap slide-wrap--event">
                        <div class="swiper">
                            <div class="swiper-wrapper">
                                {{#if evntHome}}
                                    {{#each evntHome}}
                                        <div class="swiper-slide">
                                            <a href="">
                                                <!-- /image/common/loading.gif -->
                                                <img 
                                                    src=""
                                                    data-src="{{image}}"
                                                    class="testSample sampleTest2 lazyload"
                                                    alt=""
                                                >
                                            </a>
                                            <div class="swiper-slide__cont">
                                                <p class="swiper-slide__tit">{{title}}</p>
                                                <p class="swiper-slide__txt">
                                                    <em>{{strDt}} ~ {{endDt}}</em>
                                                    <em>{{glry.glryNm}}, {{glry.area}} {{glry.dong}}</em>
                                                </p>
                                            </div>
                                        </div>
                                    {{/each}}
                                {{else}}
                                    {{{loadingScr "sampleTest2"}}}
                                {{/if}}
                            </div>
                        </div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>
                    </div>
                    <div class="slide-list__tit">
                        <a href="glyHome">
                            <p>갤러리</p>
                        </a>
                    </div>
                    <div class="slide-wrap slide-wrap--gallery">
                        <div class="swiper">
                            <div class="swiper-wrapper">
                                {{#if glryHome}}
                                    {{#each glryHome}}
                                        <div class="swiper-slide">
                                            <a href="/atwrkList/{{_id}}">
                                                <!-- /image/common/loading.gif -->
                                                <img 
                                                    src=""
                                                    data-src="{{glryImage}}"
                                                    class="sampleTest2 lazyload"
                                                    alt=""
                                                >
                                            </a>
                                            <div class="swiper-slide__cont">
                                                <p class="swiper-slide__tit">{{glryNm}}</p>
                                                <p class="swiper-slide__txt">
                                                    <em>{{area}} {{dong}}</em>
                                                </p>
                                            </div>
                                        </div>
                                    {{/each}}
                                {{else}}
                                    {{{loadingScr "sampleTest2"}}}
                                {{/if}}
                            </div>
                        </div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>
                    </div>
                </article>
            </div>
        </div>
    </section>
    <footer class="footer">
        {{> footer}}
    </footer>
    {{> utilsPopUp popup}}
    
</template>
