<template name="inventoryMode">
    {{#if renderFlag}}
        <script type="text/javascript" src="/libs/common.js"></script>
        <script type="text/javascript" src="/libs/sub.js"></script>
    {{/if}}
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <div class="sub-content border-0">
                    <div class="sub-content__mypage">
                        <div class="mypage-subtit mypage-subtit--gallery height-66">
                            <div class="mypage-subtit__inner">
                                {{#with bsnsInfo}}
                                <p style="color:#000;">우) {{zipCd}} , {{addr1}}       Tel: {{bsnsChagMob}},    email: {{bsnsChagEmail}},   {{homeUrl}}</p>
                                {{/with}}
                                <div class="btn-wrap ml-auto">
                                    <button type="button" class="btn btn--round btn--white-blue popup" data-id="inventory_popup_preview">인쇄 미리보기</button>
                                </div>
                            </div>
                        </div>
                        <div class="myGallery-wrap">
                            <div class="myGallery-block d-flex" style="padding-left:8rem;">
                                <div class="myGallery-checkTable col-11">
                                    <div class="table-wrap">
                                        <table class="table-basic table--row table-basic--mygallery__checks">
                                            <caption></caption>
                                            <colgroup>
                                                <col style="width:14rem">
                                                <col style="width:auto">
                                            </colgroup>
                                            <tbody>
                                                
                                                <tr>
                                                    <th scope="row">
                                                        <div class="d-flex justify-between">
                                                            <span class="font-pre">아 티 스 트</span>
                                                            <!-- <button type="button">
                                                                <img src="/image/sub/icon/icon-plus.svg" alt="">
                                                            </button> -->
                                                        </div>
                                                    </th>
                                                    <td>
                                                        <div class="form-wrap">
                                                            <div class="form-row">
                                                                {{#each glryAtstList}}
                                                                    <div class="form-check">
                                                                        <input type="checkbox" name="menuSchChk" value="ATST-{{_id}}" id="check-mygallery--checksAuthor{{@index}}">
                                                                        <label for="check-mygallery--checksAuthor{{@index}}">{{_id}}</label>
                                                                    </div>
                                                                {{/each}}                                                            
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                                
                                            </tbody>
                                        </table>
                                    </div>
                                    <button type="button" name="menuAllCancel" class="btn-reset ml-150 mt-10">
                                        <img src="/image/sub/icon/icon-reset.svg" alt="">
                                        전체 선택해제
                                    </button>
                                </div>
                                <button type="button" name="menuSchBtn" class="btn btn--round btn--white col-1 ml-10">검색</button>
                            </div>
                            <div class="myGallery-block mt-30">
                                <div class="myGallery-listTable">
                                    {{#if renderFlag}}
                                    <div class="table-wrap">
                                        <div class="swiper table-swiper">
                                        <div class="swiper-wrapper">
                                        {{#each invntInfo}}
                                        <div class="swiper-slide" style="max-height: 600px; min-height: 600px; overflow: auto;">
                                        <table class="table-basic table--col table-basic--mygallery__inventory">
                                            <caption></caption>
                                            <colgroup>
                                                <col style="width:10%">
                                                <col style="width:15%">
                                                <col style="width:auto">
                                                <col style="width:10%">
                                                <col style="width:10%">
                                                <col style="width:10%">
                                                <col style="width:8%">
                                            </colgroup>
                                            <tbody>
                                                <tr>
                                                    <td colspan="7">
                                                        <div class="d-flex align-center">
                                                            {{#with atstInfos}}
                                                                <span class="img-wrap">
                                                                    <img class="selling-img" src="{{image}}" alt="">
                                                                </span>
                                                                <p class="txt-wrap">
                                                                    <span class="ml-50 font-12 fontW-b">{{atstNm}}</span>
                                                                    <em class="ml-50 font-12 fontW-500">작가소개)    {{atstDesc}}</em>
                                                                </p>
                                                            {{/with}}
                                                        </div>
                                                    </td>
                                                </tr>
                                                {{#each atwrkInfo}}
                                                <tr>
                                                    <td>Inventory 번호</td>
                                                    <td>작품사진</td>
                                                    <td>설     명</td>
                                                    <td>작품연도 </td>
                                                    <td>작 품 가 격</td>
                                                    <td>구    분</td>
                                                    <td>선택</td>
                                                </tr>
                                                <tr id="{{atwrkId}}">
                                                    <td>{{numbering @index}}</td>
                                                    <td>
                                                        <span>
                                                            <img class="selling-img" src="{{image}}" alt="">
                                                        </span>
                                                    </td>
                                                    {{#if ogChk ogNm}}
                                                        <td>제목:  {{dtNm}},    사이즈: {{dtSize}},     베이스:  {{codeToName dtBase "BASE"}}</td>
                                                        <td>{{dtYY}}</td>
                                                        <td class="line-20">
                                                            {{commaPric dtPric}}<br/>
                                                        </td>
                                                        <td>디지털 판화</td>
                                                    {{else}}
                                                        {{#if bothChk dtNm}}
                                                            <td>제목:  {{ogNm}},    크기: {{ogWSize}} x {{ogHSize}},     재료:  {{codeToName ogMet "MATERIAL"}}</td>
                                                            <td>{{ogYY}}</td>
                                                            <td class="line-20">
                                                                {{commaPric ogPric}}<br/>
                                                                ({{commaPric dtPric}})
                                                            </td>
                                                            <td>원 화 + 디지털판화</td>
                                                        {{else}}
                                                            <td>제목:  {{ogNm}},    크기: {{ogWSize}} x {{ogHSize}},     재료:  {{codeToName ogMet "MATERIAL"}}</td>
                                                            <td>{{ogYY}}</td>
                                                            <td class="line-20">
                                                                {{commaPric ogPric}}<br/>
                                                            </td>
                                                            <td>원 화</td>
                                                        {{/if}}
                                                    {{/if}}
                                                    <td>
                                                        <div class="form-wrap">
                                                            <div class="form-check">
                                                                <input type="checkbox" checked style="margin: 0px; width: 2.1rem; height: 2.1rem;" name="atwrkChkBox" id="" value="{{atwrkId}}" class="form-check__input">
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            {{/each}}
                                            </tbody>
                                        </table>
                                        </div>
                                        {{/each}}
                                        </div>
                                            <div class="swiper-pagination"></div>
                                        </div>
                                    </div>
                                    {{/if}}
                                </div>
                                <div class="pagination-wrap mt-40 mb-40"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- /container -->
    <div class="popup-layout" id="del_confirm_popup">
        <div class="popup-wrap">
            <div class="popup-inner" style="width:347px;">
                <div class="popup-head">
                    <p class="popup-head__tit"></p>
                    <button type="button" class="popup-close">
                        <img src="/image/common/icon/icon-popup-close.png" alt="">
                    </button>
                </div>
                <div class="popup-cont">
                    <p class=" mt-30 font-14 fontW-b color--txt ta-c">정말 삭제 하시겠습니까?</p>
                    <div class="btn-wrap d-flex justify-center mt-40">
                        <button type="button" class="btn btn--white btn--round width--170 height-40 font-pre popup-chk">취   소</button>
                        <button type="button" name="delConfirmBtn" class="btn btn--blue btn--round width--170 height-40 ml-20 font-pre">삭  제</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        {{> footer}}
    </footer>
    
    <!-- popup -->
    <div class="popup-layout" id="inventory_popup_preview">
        <div class="popup-wrap popup--additional">
            <div class="popup-inner" style="width:1680px;height:calc(100% - 5rem)">
                <div class="popup-head">
                    <div class="subTit-tit--center">
                        <div class="subTit__inner  d-flex align-center">
                            <img class="header-logo-img" src="/image/common/img-logo-default.png" alt="">
                            <p class="subTit-tit--center__p color-blue">인벤토리 미리보기 팝업</p>
                            <button type="button" class="popup-close">
                                <img src="/image/sub/icon/icon-close-gray.png" alt="">
                            </button>
                        </div>
                    </div>
                </div>

                <div class="popup-cont popup-cont--terms" style="overflow: auto;" id="printAreas">
                    <div class="mypage-subtit mypage-subtit--gallery height-66">
                        <div class="mypage-subtit__inner" style="border-bottom: 0px solid #b9b9b9;">
                            {{#with bsnsInfo}}
                            <p style="color:#000;">우) {{zipCd}} , {{addr1}}       Tel: {{bsnsChagMob}},    email: {{bsnsChagEmail}},   {{homeUrl}}</p>
                            {{/with}}
                            <div class="btn-wrap ml-auto mr-10">
                                <button type="button" name="printBtn" class="btn btn--round btn--white-blue">인쇄하기</button>
                            </div>
                        </div>
                    </div>

                    <div class="table-wrap" style="margin: 50px; width: 100%; text-align: center;">
                        {{#each printShow}}
                        <table class="table-basic table--col table-basic--mygallery__inventory" style="margin-top: 30px;">
                            <caption></caption>
                            <colgroup>
                                <col style="width:10%">
                                <col style="width:15%">
                                <col style="width:auto">
                                <col style="width:10%">
                                <col style="width:10%">
                                <col style="width:10%">
                                <col style="width:8%">
                            </colgroup>
                            <tbody>
                                <tr>
                                    <td colspan="6">
                                        <div class="d-flex align-center">
                                            {{#with atstInfos}}
                                                <span class="img-wrap">
                                                    <img class="selling-img" src="{{image}}" alt="">
                                                </span>
                                                <p class="txt-wrap">
                                                    <span class="ml-50 font-12 fontW-b">{{atstNm}}</span>
                                                    <em class="ml-50 font-12 fontW-500">작가소개)    {{atstDesc}}</em>
                                                </p>
                                            {{/with}}
                                        </div>
                                    </td>
                                </tr>
                                {{#each atwrkInfo}}
                                {{#if printShowChk this}}
                                <tr>
                                    <td>Inventory 번호</td>
                                    <td>작품사진</td>
                                    <td>설     명</td>
                                    <td>작품연도 </td>
                                    <td>작 품 가 격</td>
                                    <td>비    고</td>
                                </tr>
                                <tr id="{{atwrkId}}">
                                    <td>{{numbering @index}}</td>
                                    <td>
                                        <span>
                                            <img class="selling-img" src="{{image}}" alt="">
                                        </span>
                                    </td>
                                    {{#if ogChk ogNm}}
                                        <td>제목:  {{dtNm}},    사이즈: {{dtSize}},     베이스:  {{codeToName dtBase "BASE"}}</td>
                                        <td>{{dtYY}}</td>
                                        <td class="line-20">
                                            {{commaPric dtPric}}<br/>
                                        </td>
                                        <td>디지털 판화</td>
                                    {{else}}
                                        {{#if bothChk dtNm}}
                                            <td>제목:  {{ogNm}},    크기: {{ogWSize}} x {{ogHSize}},     재료:  {{codeToName ogMet "MATERIAL"}}</td>
                                            <td>{{ogYY}}</td>
                                            <td class="line-20">
                                                {{commaPric ogPric}}<br/>
                                                ({{commaPric dtPric}})
                                            </td>
                                            <td>원 화 + 디지털판화</td>
                                        {{else}}
                                            <td>제목:  {{ogNm}},    크기: {{ogWSize}} x {{ogHSize}},     재료:  {{codeToName ogMet "MATERIAL"}}</td>
                                            <td>{{ogYY}}</td>
                                            <td class="line-20">
                                                {{commaPric ogPric}}<br/>
                                            </td>
                                            <td>원 화</td>
                                        {{/if}}
                                    {{/if}}
                                </tr>
                                {{/if}}
                            {{/each}}
                            </tbody>
                        </table>
                        {{/each}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
