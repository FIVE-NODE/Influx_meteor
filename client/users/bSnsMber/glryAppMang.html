<template name="glryAppMang">
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <div class="sub-content border-0">
                    <div class="sub-content__manager">
                        <div class="manager-wrap">
                            <div class="manager-head d-flex">
                                <div class="manager-head__inner">
                                    <h1 class="contaract-logo">
                                        <a href="">
                                            <img class="header-logo-img" src="/image/common/img-logo-main.png" alt="SJLab">
                                        </a>
                                    </h1>
                                    <p class="manager-tit pos-abs pos-center">갤러리 사업자 입점신청 관리</p>
                                </div>
                            </div>
                            <div class="manager-cont mt-30 mb-50">
                                <div class="manager-cont__inner">
                                    <div class="manager-block mt-50">
                                        <div class="manager__tit ml-50 d-flex">
                                            임시 입점 신청 완료 업체
                                            <div class="ml-auto d-flex">
                                                <div class="form-wrap ml-40">
                                                    <div class="form-input form-sch form-row">
                                                        <label for="">
                                                            <input type="text" />
                                                        </label>
                                                        <button type="button">
                                                            <img src="/image/common/icon/icon-search--black.png" alt="">
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="table-wrap mt-15">
                                            <table class="table-basic table-col table-basic--manager">
                                                <caption></caption>
                                                <colgroup>
                                                    <col style="width:5%;">
                                                    <col style="width:10%;">
                                                    <col style="width:15%;">
                                                    <col style="width:10%;">
                                                    <col style="width:15%;">
                                                    <col style="width:auto">
                                                    <col style="width:10%;">
                                                </colgroup>
                                                <thead>
                                                    <tr>
                                                        <th scope="col">
                                                            <div class="form-wrap">
                                                                <div class="form-check">
                                                                    <input type="checkbox" name="" id="">
                                                                </div>
                                                            </div>
                                                        </th>
                                                        <th scope="col">업체명</th>
                                                        <th scope="col">신청서 접수시간</th>
                                                        <th scope="col">계약완료날짜</th>
                                                        <th scope="col">비번 보낸 시간</th>
                                                        <th scope="col">연락처 / 이메일</th>
                                                        <th scope="col">실 행</th>
                                                    </tr>
                                                </thead>

                                                <tbody>
                                                    {{#each glryList}}
                                                        <tr>
                                                            <td>
                                                                <div class="form-wrap">
                                                                    <div class="form-check">
                                                                        <input type="checkbox" name="" id="">
                                                                    </div>
                                                                </div>
                                                            </td>
                                                            <td>{{glryNm}}</td>
                                                            <td>--</td>
                                                            <td>--</td>
                                                            <td>{{passSendTime}}</td>
                                                            <td>{{bsnsChagMob}} / {{bsnsChagEmail}}</td>
                                                            <td>
                                                                <button type="button" name="sendPass" class="btn btn--round {{sendToPassChk passSendTime}}">비번보내기</button>
                                                            </td>
                                                        </tr>
                                                    {{/each}}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    {{> utilsPopUp popup}}
</template>
