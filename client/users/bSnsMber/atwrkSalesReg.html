<template name="atwrkSalesReg">
    <link rel="stylesheet" href="/css/lib/bootstrap.min.css">
    <link rel="stylesheet" href="/css/ux-common.css">
    <script type="text/javascript" src="/libs/common.js"></script>
    <script type="text/javascript" src="/libs/sub.js"></script>
    
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <div class="sub-content border-0">
                    <div class="sub-content__mypage">
                        <div class="mypage-subtit">
                            <div class="mypage-subtit__inner">
                                <p class="font-pre">판     매</p>
                            </div>
                        </div>
                        <div class="saleCondition-wrap mt-40">
                            <div class="saleCondition__inner width--950 mx-auto">
                                <div class="saleCondition-checks">
                                    {{#if onlyDtp}}
                                        <div style="margin-top: 150px; margin-bottom: 150px;"></div>
                                    {{else}}
                                    <h4 class="saleCondition__tit">판매 방식선택</h4>
                                    <div class="saleCondition-block saleCondition-block--method mt-10">
                                        <div class="form-wrap">
                                            <div class="form-input">
                                                <label for="check-saleCondition--method01">
                                                    <span>정 찰 가</span>
                                                    <input type="radio" name="check-saleCondition--method" value="001" id="check-saleCondition--method01">
                                                </label>
                                            </div>
                                            <div class="form-input">
                                                <label for="check-saleCondition--method02">
                                                    <span>정 찰 가 ( 가격 흥정 허용)</span>
                                                    <input type="radio" name="check-saleCondition--method" value="003" id="check-saleCondition--method02">
                                                </label>
                                            </div>
                                            <div class="form-input" name="">
                                                <label for="check-saleCondition--method03">
                                                    <span>비      딩  (옥 션)</span>
                                                    <input type="radio" name="check-saleCondition--method" value="002" id="check-saleCondition--method03">
                                                </label>
                                            </div>
                                            <div class="form-input">
                                                <label for="check-saleCondition--method04">
                                                    <span>구    입    문    의</span>
                                                    <input type="radio" name="check-saleCondition--method" value="004" id="check-saleCondition--method04">
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                    {{#if scout}}
                                        <h4 class="saleCondition__tit mt-30">가격 입력</h4>
                                        <div class="saleCondition-block saleCondition-block--price mt-10">
                                            <div class="form-wrap">
                                                <div class="form-input">
                                                    <input type="text" name="pric" id="scout">
                                                    <label >원</label>
                                                </div>
                                            </div>
                                        </div>
                                    {{/if}}

                                    {{#if scoutBargain}}
                                        <h4 class="saleCondition__tit mt-30">가격 입력</h4>
                                        <div class="saleCondition-block saleCondition-block--price mt-10">
                                            <div class="form-wrap">
                                                <div class="form-input">
                                                    <input type="text" name="pric" id="bargain">
                                                    <label >원</label>
                                                </div>
                                            </div>
                                        </div>
                                    {{/if}}

                                    {{#if bid}}
                                        <h4 class="saleCondition__tit mt-30">시작 가격 입력</h4>
                                        <div class="saleCondition-block saleCondition-block--price mt-10">
                                            <div class="form-wrap">
                                                <div class="form-input">
                                                    <input type="text" name="strPric">
                                                    <label >원</label>
                                                </div>
                                            </div>
                                        </div>
                                        <h4 class="saleCondition__tit mt-30">즉시 구매 가격 입력</h4>
                                        <div class="saleCondition-block saleCondition-block--price mt-10">
                                            <div class="form-wrap">
                                                <div class="form-input">
                                                    <input type="text" name="endPric">
                                                    <label >원</label>
                                                </div>
                                            </div>
                                        </div>
                                    {{/if}}

                                    <h4 class="saleCondition__tit mt-30">판매기간</h4>
                                    <div class="saleCondition-block d-flex justify-between  align-center mt-10 width--412">
                                        <button type="button" class="js-popup saleCondition-block__dataBtn" data-id="salesMethod_dateStart" title="판매 방식에 따른 판매기간 시작">
                                            <span name="seltStrDate" class="saleCondition-block__dataBtn--date"></span>
                                            <span name="seltStrTime" class="saleCondition-block__dataBtn--time"></span>
                                        </button>
                                        <span class="saleCondition-block__hyphen">-</span>
                                        <button type="button" class="js-popup saleCondition-block__dataBtn" data-id="salesMethod_dateEnd" title="판매 방식에 따른 판매기간 끝">
                                            <span name="seltEndDate" class="saleCondition-block__dataBtn--date"></span>
                                            <span name="seltEndTime" class="saleCondition-block__dataBtn--time"></span>
                                        </button>
                                    </div>

                                    <h4 class="saleCondition__tit mt-30">
                                        판매수수료
                                        <span class="ml-100 font-18 fontW-b color--sea">5%</span>
                                    </h4>
                                    <div class="txt-wrap d-flex width--465 mt-30 justify-between">
                                        <p class="font-24 fontW-b">최종 판매 개시 금액</p>
                                        <span class="font-24 fontW-b font-pre">{{ogTotalPric}}   원</span> 
                                    </div>
                                    
                                    {{#if scoutBargain}}
                                        <h4 class="saleCondition__tit mt-30">구매자 흥정 (가격제안) 범위 선택 </h4>
                                        <div class="saleCondition-block saleCondition-block--suggest mt-20">
                                            <div class="d-flex flex-wrap width--465">

                                                <div class="w-50 flex-1">
                                                    <div class="form-wrap">
                                                        <div class="form-block first-choice">
                                                            <div class="form-input">
                                                                <label for="check-saleCondition-suggest--01">선택 1</label>
                                                                <input type="radio" name="saleCondition__firstChoice" id="check-saleCondition-suggest--01" class=" mr-10">
                                                            </div>
                                                        </div>
                                                        <div class="form-block second-choice mt-5">
                                                            {{#each seltBargain1}}
                                                            <div class="form-check">
                                                                <label for="check-saleCondition-suggest--0101">
                                                                    <input type="radio" disabled="true" name="check-saleCondition-suggest01" id="check-saleCondition-suggest--0101">
                                                                    <span>
                                                                        {{commaPric pric}} 원
                                                                        <em>{{detail}}</em>
                                                                    </span>
                                                                </label>
                                                            </div>
                                                            {{/each}}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="w-50 flex-1 ml-10">
                                                    <div class="form-wrap">
                                                        <div class="form-block first-choice">
                                                            <div class="form-input">
                                                                <label for="check-saleCondition-suggest--02">선택 2</label>
                                                                <input type="radio" name="saleCondition__firstChoice" id="check-saleCondition-suggest--02" class=" mr-10">
                                                            </div>
                                                        </div>
                                                        <div class="form-block second-choice mt-5">
                                                            {{#each seltBargain2}}
                                                            <div class="form-check">
                                                                <label for="check-saleCondition-suggest--0201">
                                                                    <input type="radio" disabled="true" name="check-saleCondition-suggest02" id="check-saleCondition-suggest--0201">
                                                                    <span>
                                                                        {{commaPric pric}} 원
                                                                        <em>{{detail}}</em>
                                                                    </span>
                                                                </label>
                                                            </div>
                                                            {{/each}}
                                                        </div>
                                                    </div>
                                                </div>

                                                <p class="w-100 mt-5 font-11 color--sky">*판매 수수료가 포함된 가격입니다.</p>
                                            </div>
                                        </div>
                                    {{/if}}
                                    {{/if}}

                                    <h4 class="saleCondition__tit"></h4>
                                    {{#if dtPrtChk}}
                                    <div class="saleCondition-block saleCondition-block--permit mt-30">
                                        <div class="form-wrap">
                                            <div class="form-check">
                                                    <label for="check-saleCondition--permit01">
                                                        <span name="dtText">디지털 판화 동시판매 허용 </span>
                                                        <input type="checkbox" id="check-saleCondition--permit01">
                                                    </label>
                                            </div>
                                        </div>
                                    </div>
                                    {{/if}}
                                    <div name="digitalSell" style="display: none;">
                                    <h4 class="saleCondition__tit mt-30">가격 입력</h4>
                                    <div class="saleCondition-block saleCondition-block--price mt-10">
                                        <div class="form-wrap">
                                            <div class="form-input">
                                                <input type="text" name="dtPric">
                                                <label >원</label>
                                            </div>
                                        </div>
                                    </div>
                                    <h4 class="saleCondition__tit mt-30">허용작품수</h4>
                                    <div class="saleCondition-block saleCondition-block--permitNum mt-10">
                                        <div class="form-wrap">
                                            <div class="form-row">
                                                <div class="form-select form-select-custom">
                                                    <button type="button" class="custom-select__tit height-55 pl-10">100</button>
                                                    <ul class="custom-select__options" style="display: none;">
                                                        <li class="is-active"><button name="seltDtCnt" type="button">100</button></li>
                                                        <li><button name="seltDtCnt" type="button">200</button></li>
                                                        <li><button name="seltDtCnt" type="button">300</button></li>
                                                        <li><button name="seltDtCnt" type="button">직접입력</button></li>
                                                    </ul>
                                                </div>
                                                <div class="calc-box">
                                                    <input name="dtSellCnt" disabled type="number" value=100 style="font-size: 1.4rem; font-weight: 700; color: #585858;background-color: #FFFFFF; border: 0px; width: 100%;">
                                                    <label style="width: 35px;">작품</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <h4 class="saleCondition__tit mt-30">판매기간</h4>
                                    <div class="saleCondition-block d-flex justify-between  align-center mt-10 width--412">
                                        <button type="button" class="js-popup saleCondition-block__dataBtn" data-id="salesDigital_dateStart" title="판매 방식에 따른 판매기간 시작">
                                            <span name="dtSeltStrDate" class="saleCondition-block__dataBtn--date"></span>
                                            <span name="dtSeltStrTime" class="saleCondition-block__dataBtn--time"></span>
                                        </button>
                                        <span class="saleCondition-block__hyphen">-</span>
                                        <button type="button" class="js-popup saleCondition-block__dataBtn" data-id="salesDigital_dateEnd" title="판매 방식에 따른 판매기간 끝">
                                            <span name="dtSeltEndDate" class="saleCondition-block__dataBtn--date"></span>
                                            <span name="dtSeltEndTime" class="saleCondition-block__dataBtn--time"></span>
                                        </button>
                                    </div>
                                    

                                    <h4 class="saleCondition__tit mt-30">
                                        판매수수료
                                        <span class="ml-100 font-18 fontW-b color--sea">5%</span>
                                    </h4>
                                    <div class="txt-wrap d-flex width--465 mt-30 justify-between">
                                        <p class="font-24 fontW-b">최종 판매 개시 금액</p>
                                        <span class="font-24 fontW-b font-pre">{{dtTotalPric}}   원</span> 
                                    </div>
                                    </div>
                                </div>
                                {{#with atInfo}}
                                    {{#if onlyDtp}}
                                        <div class="saleCondition-profile">
                                            <span class="saleCondition-profile__img">
                                                <img class="imgfitset" src="{{selectMainImage this}}" alt="">
                                            </span>
                                            <p class="saleCondition-profile__txt">
                                                <strong>{{atstInfo.atstNm}}</strong>
                                                <span>{{dtPrt.atwrkNm}}, {{codeToName dtPrt.base "BASE"}}</span>
                                                <em>{{commaPric dtPrt.sPric}} 원</em>
                                            </p>
                                        </div>
                                    {{else}}
                                        <div class="saleCondition-profile">
                                            <span class="saleCondition-profile__img">
                                                <img class="imgfitset" src="{{selectMainImage this}}" alt="">
                                            </span>
                                            <p class="saleCondition-profile__txt">
                                                <strong>{{atstInfo.atstNm}}</strong>
                                                <span>{{ogPrt.atwrkNm}}, {{ogPrt.wSize}}x{{ogPrt.hSize}}, {{codeToName ogPrt.metRias "MATERIAL"}}</span>
                                                <em>{{commaPric ogPrt.pric}} 원</em>
                                            </p>
                                        </div>
                                    {{/if}}
                                {{/with}}
                                <div class="btn-wrap mt-100 mb-100 ta-c">
                                    <button type="button" name="cancel" class="exbtn-simple btn--round btn--white height-40 width--149 font-pre">취     소</button>
                                    <button type="button" name="salesRegBtn" class="exbtn-simple btn--round btn--blue height-40 width--149 ml-50 font-pre">판     매</button>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- popup -->
    <div class="popup-layout" id="salesMethod_dateStart" title="판매 방식에 따른 판매기간 시작 팝업">
        <div class="popup-wrap">
            <div class="popup-inner" style="width:257px;">
                <div class="popup-head">
                    <p class="popup-head__tit">판매 시작일</p>
                    <button type="button" class="popup-close">
                        <img src="/image/common/icon/icon-popup-close.png" alt="">
                    </button>
                </div>
                <div class="popup-cont popup-cont--datePop">
                    <div class="datetime-wrap">
                        <div class="date-wrap">
                            <div id="datepicker1"></div>
                        </div>
                        <div class="time-wrap">
                            <input type="text" id="ogStrTime" class="form-control timepicker" />
                        </div>
                    </div>
                    <div class="btn-wrap d-flex justify-center mt-30">
                        <button type="button" class="btn btn--white btn--round width--90 height-30 font-pre popup-close">닫    기</button>
                        <button type="button" name="ogStrDateTime" class="btn btn--blue btn--round width--90 height-30 ml-10 font-pre">확    인</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- popup -->
    <div class="popup-layout" id="salesMethod_dateEnd" title="판매 방식에 따른 판매기간 끝 팝업">
        <div class="popup-wrap">
            <div class="popup-inner" style="width:257px;">
                <div class="popup-head">
                    <p class="popup-head__tit">판매 종료일</p>
                    <button type="button" class="popup-close">
                        <img src="/image/common/icon/icon-popup-close.png" alt="">
                    </button>
                </div>
                <div class="popup-cont popup-cont--datePop">
                    <div class="datetime-wrap">
                        <div class="date-wrap">
                            <div id="datepicker2"></div>
                        </div>
                        <div class="time-wrap">
                            <input type="text" id="ogEndTime" class="form-control timepicker" />
                        </div>
                    </div>
                    <div class="btn-wrap d-flex justify-center mt-30">
                        <button type="button" class="btn btn--white btn--round width--90 height-30 font-pre popup-close">닫    기</button>
                        <button type="button" name="ogEndDateTime" class="btn btn--blue btn--round width--90 height-30 ml-10 font-pre">확    인</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- popup -->
    <div class="popup-layout" id="salesDigital_dateStart" title="디지털 판화 판매에 따른 판매기간 시작 팝업">
        <div class="popup-wrap">
            <div class="popup-inner" style="width:257px;">
                <div class="popup-head">
                    <p class="popup-head__tit">판매 시작일</p>
                    <button type="button" class="popup-close">
                        <img src="/image/common/icon/icon-popup-close.png" alt="">
                    </button>
                </div>
                <div class="popup-cont popup-cont--datePop">
                    <div class="datetime-wrap">
                        <div class="date-wrap">
                            <div id="datepicker3"></div>
                        </div>
                        <div class="time-wrap">
                            <input type="text" id="dtStrTime" class="form-control timepicker" />
                        </div>
                    </div>
                    <div class="btn-wrap d-flex justify-center mt-30">
                        <button type="button" class="btn btn--white btn--round width--90 height-30 font-pre popup-close">닫    기</button>
                        <button type="button" name="dtStrDateTime" class="btn btn--blue btn--round width--90 height-30 ml-10 font-pre">확    인</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- popup -->
    <div class="popup-layout" id="salesDigital_dateEnd" title="디지털 판화 판매에 따른 판매기간 끝 팝업">
        <div class="popup-wrap">
            <div class="popup-inner" style="width:257px;">
                <div class="popup-head">
                    <p class="popup-head__tit">판매 종료일</p>
                    <button type="button" class="popup-close">
                        <img src="/image/common/icon/icon-popup-close.png" alt="">
                    </button>
                </div>
                <div class="popup-cont popup-cont--datePop">
                    <div class="datetime-wrap">
                        <div class="date-wrap">
                            <div id="datepicker4"></div>
                        </div>
                        <div class="time-wrap">
                            <input type="text" id="dtEndTime" class="form-control timepicker" />
                        </div>
                    </div>
                    <div class="btn-wrap d-flex justify-center mt-30">
                        <button type="button" class="btn btn--white btn--round width--90 height-30 font-pre popup-close">닫    기</button>
                        <button type="button" name="dtEndDateTime" class="btn btn--blue btn--round width--90 height-30 ml-10 font-pre">확    인</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
