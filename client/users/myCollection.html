<template name="myCollection">
    <script type="text/javascript" src="/libs/common.js"></script>
    <script type="text/javascript" src="/libs/sub.js"></script>
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <div class="sub-content border-0">
                    <div class="sub-content__collect">
                        <div class="collect-wrap">
                            <div class="collect-tit">
                                <p>My 컬렉션의 작품은 디바이스에서 전체화면으로 감상하실수 있습니다. </p>
                                <div class="btn-wrap">
                                    <button type="button" name="allSelt" class="btn btn--white btn--round">전체 선택</button>
                                    <button type="button" name="noAllSelt" class="btn btn--white btn--round">전체선택 해제</button>
                                    <button type="button" name="seltAllShow" data-id="detail_popup" class="btn btn--white btn--round popup">선택 전체보기</button>
                                </div>
                            </div>

                            <div class="collect-list mt-50">
                                {{#each myCollect}}
                                    {{#with atwrkInfo atwrkID}}
                                        <div class="collect-item">
                                            <div class="form-wrap">
                                                <div class="form-check">
                                                    <input type="checkbox" name="chkMyCollect" value="{{_id}}_{{@index}}">
                                                </div>
                                            </div>
                                            <span class="collect-item__img">
                                                <a href="/myCollectionDetail/{{_id}}">
                                                    <img class="myCollectImgSize" id="{{_id}}_{{@index}}" src="{{selectMainImage this}}" alt="">
                                                </a>
                                            </span>
                                            <div class="collect-item__txt">
                                                <p name="{{_id}}_{{@index}}">{{atstInfo.atstNm}}</p>
                                                {{#if ogPrtChk ../atwrkID}}
                                                <span name="{{_id}}_{{@index}}">
                                                    {{ogPrt.atwrkNm}},  {{ogPrt.wSize}} x {{ogPrt.hSize}}, {{codeToName ogPrt.metRias "MATERIAL"}}<br/>
                                                    {{glry.glryNm}}<br/>
                                                    {{commaPric ../amt}}  원                                       
                                                </span>
                                                {{else}}
                                                <span name="{{_id}}_{{@index}}">
                                                    {{dtPrt.atwrkNm}}, {{codeToName dtPrt.base "BASE"}}<br/>
                                                    {{glry.glryNm}}<br/>
                                                    {{commaPric ../amt}}  원
                                                </span>
                                                {{/if}}
                                            </div>
                                        </div>
                                    {{/with}}
                                {{/each}}
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="popup-layout" id="detail_popup">
        <div class="popup-wrap">
            <div class="popup-inner" style="width:1440px;height:100%;background-color:transparent;border-radius:0;">
                <div class="popup-cont popup-cont--fullscreenView">
                    <div class="fullscreenView-wrap">
                        <!--  -->
                        <div style="height: 100%;" class="swiper">

                            <div class="swiper-wrapper" id="swiperLists">
                                <!-- {{#each popUpList}}
                                    <div class="swiper-slide">
                                        <span class="fullscreenView__img">
                                            <img src="{{imgUrl}}" alt="">
                                        </span>
                                        <div class="fullscreenView__txt">
                                            <p>{{atstNm}}</p>
                                            <span>
                                                {{detail}}<br/>
                                                (제목, 크기, 재료)
                                            </span>
                                        </div>
                                    </div>
                                {{/each}} -->
                            </div>

                            <button style="z-index: 1;" type="button" class="fullscreenView__btn fullscreenView__btn--close popup-close">
                                <img src="/image/sub/icon/icon-popup--close.png" alt="">
                            </button>
                            <button style="z-index: 1;" type="button" class="my-button-prev fullscreenView__btn fullscreenView__btn--prev">
                                <img src="/image/sub/icon/icon-popup--prev.png" alt="">
                            </button>
                            <button style="z-index: 1;" type="button" class="my-button-next fullscreenView__btn fullscreenView__btn--next">
                                <img src="/image/sub/icon/icon-popup--next.png" alt="">
                            </button>
                        </div>
                        <!--  -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- /container -->
</template>
