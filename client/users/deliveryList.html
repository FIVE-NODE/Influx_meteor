<template name="deliveryList">
    <div class="wrap">
        <div class="popup-layout" id="deliveryList_popup">
            <div class="popup-wrap">
                <div class="popup-inner popupOverFlow">
                    <div class="popup-head">
                        <p class="popup-head__tit">배송지 등록 및 관리</p>
                        <button type="button" class="popup-close">
                            <img src="/image/common/icon/icon-popup-close.png" alt="">
                        </button>
                    </div>

                    <div class="popup-cont popup-cont--addrAdmit">

                        <div class="addrAdmit-wrap">
                            <div class="addrAdmit-list">
                                {{#each delivList}}
                                    <div id="{{@index}}" name="delList" class="addrAdmit-item {{activeChk defDelivYn}}">
                                        <p class="addrAdmit-item__detail">
                                            <span>{{recptnNm}}</span>
                                            <span>{{mob}}</span>
                                            <span>({{zipCd}}) {{addr1}}, {{addr2}}</span>
                                        </p>
                                        <div class="btn-wrap">
                                            <button value="{{@index}}" class="popup" name="delivEdit" type="button" data-id="deliveryEdit_popup">수     정</button>
                                            <button value="{{@index}}" name="delivDele" type="button">삭     제</button>
                                        </div>
                                        <button type="button" name="defDelivYn" class="addrAdmit-setting">
                                            <span></span>기본 배송지 설정
                                        </button>
                                    </div>
                                {{/each}}
                            </div>
                        </div>
                        <div class="btn-wrap w-100 mt-60">
                            <button type="button" name="delivRegBtn" data-id="deliveryReg_popup" class="btn btn--blue w-100 height-40 popup">배송지 등록</button>
                        </div>
                        <div class="btn-wrap d-flex justify-center mt-30">
                            <button type="button" class="btn btn--white btn--round width--120 height-40 font-pre popup-close">닫    기</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
