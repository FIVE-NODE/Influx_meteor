<template name="deliveryReg">
    <script type="text/javascript" src="/libs/common.js"></script>
    <div class="wrap">
        <!-- popup -->
        <div class="popup-layout" id="deliveryReg_popup">
            <div class="popup-wrap">
                <div class="popup-inner" style="width:486px;">
                    <div class="popup-head">
                        <p class="popup-head__tit">신규 배송지</p>
                        <button type="button" class="popup-close">
                            <img src="/image/common/icon/icon-popup-close.png" alt="">
                        </button>
                    </div>
                    <div class="popup-cont popup-cont--addrWrite">
                        <div class="addrWrite-wrap">
                            <dl class="addrWrite-dl">
                                <dt>수령인</dt>
                                <dd>
                                    <div class="form-wrap">
                                        <div class="form-input">
                                            <input name="recptnNm" type="text" class="width--196">
                                        </div>
                                    </div>
                                </dd>
                                <dt>배송자명(선택)</dt>
                                <dd>
                                    <div class="form-wrap">
                                        <div class="form-input">
                                            <input name="delivNm" type="text" class="width--196">
                                        </div>
                                    </div>
                                </dd>
                                <dt>휴대전화</dt>
                                <dd>
                                    <div class="form-wrap">
                                        <div class="form-row width--196">
                                            <div class="form-input flex-1">
                                                <input maxlength="3" name="mob1" type="number" style="height: 30px;" class="w-100">
                                            </div>
                                            <span class="mx-3">-</span>
                                            <div class="form-input flex-1">
                                                <input maxlength="4" name="mob2" type="number" style="height: 30px;" class="w-100">
                                            </div>
                                            <span class="mx-3">-</span>
                                            <div class="form-input flex-1">
                                                <input maxlength="4" name="mob3" type="number" style="height: 30px;" class="w-100">
                                            </div>
                                        </div>
                                    </div>
                                </dd>
                                <dt>전화번호</dt>
                                <dd>
                                    <div class="form-wrap form-row">
                                        <div class="form-row width--196">
                                            <div class="form-input flex-1">
                                                <input maxlength="3" type="number" name="homePhone1" style="height: 30px;" class="w-100 homephones">
                                            </div>
                                            <span class="mx-3">-</span>
                                            <div class="form-input flex-1">
                                                <input maxlength="4" type="number" name="homePhone2" style="height: 30px;" class="w-100 homephones">
                                            </div>
                                            <span class="mx-3">-</span>
                                            <div class="form-input flex-1">
                                                <input maxlength="4" type="number" name="homePhone3" style="height: 30px;" class="w-100 homephones">
                                            </div>
                                        </div>
                                        <div class="form-check form-row align-center ml-10">
                                            <input type="checkbox" name="" id="check-addrWrite--no">
                                            <label for="check-addrWrite--no" class="ml-5 font-12">없음</label>
                                        </div>
                                    </div>
                                </dd>
                                <dt>배송지 주소</dt>
                                <dd>
                                    <div class="form-wrap">
                                        <div class="form-input form-row flex-wrap">
                                            <input name="zipCode" type="text" class="width--196" disabled>
                                            <button type="button" name="addrsBtn" class="btn btn--blue addrWrite-schBtn ml-10 popup" data-id="addrs-Popup">검색</button>
                                            <input name="address" type="text" class="w-100 mt-5"  disabled>
                                            <input name="addr2" type="text" class="w-100 mt-5">
                                        </div>
                                        <div class="form-radio mt-5 ml-10">
                                            <input name="delivReq" type="checkbox" id="check-addrWrite--default">
                                            <label for="check-addrWrite--default" class="font-12">기본 배송지 설정</label>
                                        </div>
                                    </div>
                                </dd>
                                <dt class="mb-0">배송요청사항(선택)</dt>
                                <dd class="mb-0">
                                    <div class="form-wrap">
                                        <div class="form-select form-select-custom">
                                            <button type="button" class="custom-select__tit">배송시 요청사항을 선택해주세요.</button>
                                            <ul class="custom-select__options" style="display: none;">
                                                <li class="is-active"><button name="selectDeliv" type="button">배송시 요청사항을 선택해주세요.</button></li>
                                                <li><button name="selectDeliv" type="button">부재 시 경비실에 맡겨주세요</button></li>
                                                <li><button name="selectDeliv" type="button">부재 시 택배함에 넣어주세요</button></li>
                                                <li><button name="selectDeliv" type="button">부재 시 집 앞에 놔주세요</button></li>
                                                <li><button name="selectDeliv" type="button">배송 전 연락 바랍니다. </button></li>
                                                <li><button name="selectDeliv" type="button">파손의 위험이 있는 상품입니다. 배송 시 주의해 주세요.</button></li>
                                                <li><button name="selectDeliv" type="button">직접입력</button></li>
                                            </ul>
                                            <input name="delivReqEtc" placeholder="배송시 요청 사항을 입력해주세요" style="display: none;" type="text" class="w-100 mt-5">
                                        </div>
                                    </div>
                                </dd>
                            </dl>
                        </div>
                        <div class="btn-wrap d-flex justify-center mt-70">
                            <button type="button" class="btn btn--white btn--round width--120 height-40 font-pre popup-close">취    소</button>
                            <button type="button" name="delivIns" class="btn btn--blue btn--round width--120 height-40 ml-20 font-pre">등    록</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {{> zipCode addr}}
</template>
