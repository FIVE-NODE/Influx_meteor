<template name="login">
    <script type="text/javascript" src="/libs/common.js"></script>
    <script type="text/javascript" src="/libs/sub.js"></script>
    <section class="section-seperate section-seperate--login bg--gray h-100">
        <div class="section-seperate__inner width--650 mx-auto bg--white ta-c">
            <h1 class="section-seperate__logo">
                <a href="/aOne">
                    <img class="login-main-logo-img" src="/image/common/img-logo-default.png" alt="">
                </a>
            </h1>
            {{#if loginFlag}}
                <div class="tab-wrap tab-wrap--join">
                    <a name="user" href="" class="is-active">가 입 회 원</a>
                    <a name="nouser" href="" class="">비회원 주문 조회</a>
                </div>
            {{else}}
                <div class="tab-wrap tab-wrap--join">
                    <a name="user" href="" class="">가 입 회 원</a>
                    <a name="nouser" href="" class="is-active">비회원 주문 조회</a>
                </div>
            {{/if}}
            <div class="width--257">
                {{#if loginFlag}}
                    <div class="form-wrap mt-15">
                        <div class="form-input">
                            <input type="text" name="loginEmail" placeholder="아이디" />
                        </div>
                        <div class="form-input mt-10">
                            <input type="password" name="loginPwd" placeholder="비밀번호" />
                        </div>
                    </div>
                    <!-- {{> loginButtons}} -->
                    <button type="button" name="loginBtn" class="btn btn--blue mt-20">로 그 인</button>
                    <div class="find-link d-flex justify-end mt-10">
                        <a href="" name="" class="color--gray font-12 popup" data-id="idSchPop">아이디 찾기</a>
                        <a href="" name="passFind" class="color--gray font-12 popup" data-id="passSchPop">비밀번호 찾기</a>
                    </div>
                    <button type="button" name="kakaoLogin" class="btn btn--yellow d-flex mt-30">
                        <img src="/image/sub/icon/icon-kakao.png" alt="">
                        <span>카카오 로그인</span>
                    </button>
                    <button type="button" name="naverLogin" class="btn btn--green d-flex mt-10">
                        <img src="/image/sub/icon/icon-naver.png" alt="">
                        <span>네이버 로그인</span>
                    </button>
                    <a href="/signUp" class="link-to-join mt-15">회 원 가 입</a>
                {{else}}
                    <div class="form-wrap mt-30">
                        <div class="form-input">
                            <p class="form-input__capt">주문자명</p>
                            <input type="text" placeholder="" />
                        </div>
                        <div class="form-input mt-10">
                            <p class="form-input__capt">주문번호</p>
                            <input type="text" placeholder="" />
                        </div>
                    </div>
                    <button type="button" name="seltOrder" class="btn btn--blue mt-20">주문 내역 조회하기</button>
                    <a href="/signUp" class="link-to-join mt-15">회 원 가 입</a>
                {{/if}}
            </div>
            <p class="copyright--join">
                <img class="login-footer-logo-img" src="/image/common/img-logo-join.png" alt="">
                <span>Copyright ⓒSJLab Corp. All Rights Reserved.</span>
            </p>
        </div>
    </section>
    {{> utilsPopUp popup}}

    <!-- 아이디 찾기 -->
    <div class="popup-layout" id="idSchPop">
        <div class="popup-wrap">
            <div class="popup-inner" style="width:403px;height:500px;">
                <div class="popup-head">
                    <p class="popup-head__tit">아이디 찾기</p>
                    <button type="button" class="popup-close">
                        <img src="/image/common/icon/icon-popup-close.png" alt="">
                    </button>
                </div>
                <div class="popup-cont popup-cont--terms">
                    <div class="ov-auto scrollbar" style="height:350px;" name="emailSchDiv">
                        <input autocomplete='off' type="text" name="schEmail" placeholder="이메일 주소를 입력해주세요" class="" style="width: 100%" />
                        {{#if schMsg}}
                            <p style="color: red; font-size: 14px; margin-top: 10px;">{{schMsg}}</p>
                        {{/if}}
                        <button class="login-id-sch" name="authReq">인증 요청 <img name="loading" src="/image/common/loading_img.gif" width="20px" style="display: none;" /> </button>
                        <input autocomplete='off' type="text" name="authSchId" placeholder="인증번호를 입력해주세요" class="" style="width: 100%; display: none; margin-top: 15px;" />
                        {{#if subSchMsg}}
                            <p style="color: red; font-size: 14px; margin-top: 10px;">{{subSchMsg}}</p>
                        {{/if}}
                        <div class="btn-wrap d-flex justify-center mt-20">
                            <button type="button" name="authChk" class="btn btn--blue width--112" style="display: none;">확인
                                <img name="loadingCur" src="/image/common/loading_img.gif" width="20px" style="display: none;" />
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 비밀번호 찾기 passSchPop -->
    <div class="popup-layout" id="passSchPop">
        <div class="popup-wrap">
            <div class="popup-inner" style="width:403px;height:500px;">
                <div class="popup-head">
                    <p class="popup-head__tit">비밀번호 찾기</p>
                    <button type="button" class="popup-close">
                        <img src="/image/common/icon/icon-popup-close.png" alt="">
                    </button>
                </div>
                <div class="popup-cont popup-cont--terms">
                    <div class="ov-auto scrollbar" style="height:350px;" name="emailSchDiv">
                        <input autocomplete='off' type="text" name="schPassId" placeholder="이메일을 입력해주세요요" class="" style="width: 100%" />
                        <button class="login-id-sch" name="schPassChk">인증 요청 <img name="loading" src="/image/common/loading_img.gif" width="20px" style="display: none;" /> </button>
                        <input autocomplete='off' type="text" name="authPassCode" placeholder="인증번호를 입력해주세요" class="" style="width: 100%; display: none; margin-top: 15px;" />
                        <div class="btn-wrap d-flex justify-center mt-20">
                            <button type="button" name="authPassCodeChk" class="btn btn--blue width--112" style="display: none;">확인
                                <img name="loadingCur" src="/image/common/loading_img.gif" width="20px" style="display: none;" />
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
