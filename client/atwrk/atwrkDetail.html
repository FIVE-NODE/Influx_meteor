<template name="atwrkDetail">
    <section class="container">
        <div class="content">
            {{#with atwrkDetail}}
            <div class="content__inner">
                <div class="sub-content border-0">
                    <div class="sub-content__product">
                        <div class="product-wrap">
                            <div class="product-view">
                                <ul class="bradCrumb bradCrumb-sub w-100">
                                    <li>갤러리</li>
                                    <li>{{atwrkDetail.glry.glryNm}}</li>
                                    <li>작품 상세정보</li>
                                </ul>
                                <div class="product-view__imgGroup">
                                    <div class="imgGroup-list">
                                        {{#each detailImages}}
                                            <button name="imgList" type="button">
                                                <img 
                                                    src=""
                                                    data-src="{{imgID}}"
                                                    class="testSample lazyload"
                                                    alt=""
                                                >
                                            </button>
                                        {{/each}}
                                        <button name="imgInterior" type="button">
                                            <div class="back border text-center">
                                                <img src="{{mainImage.imgID}}" style="margin-top: 15px; width: 30px; height: 30px;" alt="">
                                            </div>
                                        </button>
                                    </div>
                                    <div class="imgGroup-detail">
                                        {{#if sampleInterior}}
                                            <div class="imgGroup-detail__img border back text-center detailBack">
                                                <img 
                                                    id="target"
                                                    src=""
                                                    data-src="{{mainImage.imgID}}"
                                                    class="atwrkInteriorSample testSample lazyload"
                                                    alt=""
                                                >
                                                <!--ADDSCC  <img src="{{imgID}}" alt="">  -->
                                                <!-- <img id="target" class="mt-40 atwrkInteriorSample" src="{{mainImage.imgID}}" alt=""> -->
                                            </div>
                                        {{else}}
                                            <div class="imgGroup-detail__img">
                                                <img 
                                                    name="mainImg"
                                                    src=""
                                                    data-src="{{mainImage.imgID}}"
                                                    class="testSample lazyload"
                                                    style="max-width: 550px;" 
                                                    alt=""
                                                >
                                                <!-- <img name="mainImg" src="{{mainImage.imgID}}" style="max-width: 550px;" alt=""> -->
                                            </div>
                                        {{/if}}
                                        <button type="button" class="imgGroup-detail__favor {{goodChk}} goodBtnEvt" name="goodBtn">
                                            <img src="/image/sub/icon/icon-favor.png" alt="">
                                        </button>
                                    </div>
                                </div>
                                <div class="product-view__purchase">
                                    <div class="tab-wrap tab-purchace">
                                        <div class="tab-link">
                                            {{#if dataChk atwrkDetail "ogPrt"}}
                                                <button type="button" name="ogPrtTab" class="{{atwrkDetail.ogPrtActive}}" data-id="purchace--01">원    화</button>
                                            {{/if}}
                                            {{#if dataChk atwrkDetail "dtPrt"}}
                                                <button type="button" name="dtPrtTab" class="{{atwrkDetail.dtPrtActive}}" data-id="purchace--02">디지털 에디션 판화</button>
                                            {{/if}}
                                        </div>

                                        <!-- {{#if atwrkDetail}} -->
                                            <!-- 원 화 부분 -->
                                                <div class="tab-cont {{atwrkDetail.ogPrtOpen}}" id="purchace--01">
                                                    <div class="purchace-wrap">
                                                        <div class="purchace-top">
                                                            <p class="purchace__tit">{{atwrkDetail.atstInfo.atstNm}}</p>
                                                            <p class="purchace__subtit mt-30">{{atwrkDetail.ogPrt.atwrkNm}}, {{atwrkDetail.ogPrt.mkYY}}</p>
                                                            <span class="purchace__info mt-20">
                                                                {{codeToName atwrkDetail.ogPrt.metRias "MATERIAL"}}<br/>
                                                                {{atwrkDetail.ogPrt.wSize}} x {{atwrkDetail.ogPrt.hSize}} cm                                                        
                                                            </span>
                                                            {{#if priceChk}}
                                                            {{else}}
                                                                {{#if bidChk}}
                                                                    <p class="purchace__price mt-30">즉시 구매가 {{commaPric atwrkDetail.ogPrt.bid.immdPurchPric}} 원</p>
                                                                {{else}}
                                                                    <p class="purchace__price mt-30">{{commaPric atwrkDetail.ogPrt.pric}} 원</p>
                                                                {{/if}}
                                                            {{/if}}
                                                            {{#if bargainingChk}}
                                                                <div class="btn-wrap purchace__btns mt-50">
                                                                    <a href="" name="bargainingBtn" class="btn btn--blue btn--round">흥정하기(구매자 가격 제안)</a>
                                                                    <a href="" name="shBasket" class="btn btn--blue btn--round">장 바 구 니</a>
                                                                </div>
                                                                <div class="btn-wrap purchace__btns mt-10">
                                                                    <a href="" name="ogPrtBuy" class="btn btn--blue btn--round">구 매 하 기</a>
                                                                </div>
                                                            {{else if priceChk}}
                                                                <div class="btn-wrap purchace__btns mt-50">
                                                                    <a href="" name="priceInquiry" class="btn btn--blue btn--round">작 품 가 격 문 의</a>
                                                                </div>
                                                            {{else}}
                                                                <div class="btn-wrap purchace__btns mt-50">
                                                                    <a href="" name="ogPrtBuy" class="btn btn--blue btn--round {{sellTpChk}}">구 매 하 기</a>
                                                                    <a href="" name="shBasket" class="btn btn--blue btn--round {{sellTpChk}}">장 바 구 니</a>
                                                                </div>
                                                            {{/if}}
                                                        </div>
                                                        {{#if bidChk}}
                                                            <div class="purchace-mid">
                                                                <div class="purchace-wrap">
                                                                    <div class="purchace-top">
                                                                        <p class="purchace__price mt-10 txt-align-right">현재 비딩가격 {{commaPric atwrkDetail.ogPrt.bid.nPric}} 원</p>
                                                                        <span class="purchace__info mt-10 txt-align-right">시작가 {{commaPric atwrkDetail.ogPrt.bid.strAmt}} 원</span>
                                                                        <div class="btn-wrap purchace__btns mt-20">
                                                                            <a href="" name="bidBtn" class="popup btn btn--blue btn--round">비 딩 하 기</a>
                                                                            <a href="" name="aTagoodBtn" class="btn btn--blue btn--round goodBtnEvt">관 심 항 목 에 넣 기</a>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        {{/if}}
                                                        <div class="purchace-mid">
                                                            <div class="d-flex purchace-comp">
                                                                <p class="purchace-comp__tit">{{atwrkDetail.glry.glryNm}}</p>
                                                                <p class="purchace-comp__addr">{{atwrkDetail.glry.area}} {{atwrkDetail.glry.sigungu}} {{atwrkDetail.glry.dong}}</p>
                                                                <button type="button" name="getNews" class="purchace-comp__btn">
                                                                    <img src="{{newsChk}}" alt="">
                                                                    소 식 받 기
                                                                </button>
                                                            </div>
                                                        </div>
                                                        <div class="purchace-bot">
                                                            <div class="purchace-policy">
                                                                <p>
                                                                    <span>
                                                                        <img src="/image/sub/icon/icon-check.png" alt="">
                                                                    </span>
                                                                    운송비 정책
                                                                </p>
                                                                <p>
                                                                    <span>
                                                                        <img src="/image/sub/icon/icon-check.png" alt="">
                                                                    </span>
                                                                    구매 후 15일 반품 정책
                                                                </p>
                                                            </div>
                                                            <div class="purchace-counts mt-40">
                                                                <!-- <button name="itemGood" disabled="{{loginChk}}"> -->
                                                                    <p class="purchace-counts__favor">
                                                                        <span class="purchace-counts__favor--img"><img src="/image/sub/icon/icon-favor__count.png" alt=""></span>
                                                                        <span name="ogPrtGoodCnt">{{atwrkDetail.ogPrt.goodCnt}}</span>
                                                                    </p>
                                                                <!-- </button>  -->
                                                                <p class="purchace-counts__views">
                                                                    <span>{{atwrkDetail.ogPrt.viewCnt}}</span> Views
                                                                </p>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>

                                                <!-- 디지털 에디션 판화 부분 -->
                                                <div class="tab-cont {{atwrkDetail.dtPrtOpen}}" id="purchace--02">
                                                    <div class="purchace-wrap">
                                                        <div class="purchace-top">
                                                            <p class="purchace__tit">{{atwrkDetail.atstInfo.atstNm}}</p>
                                                            <p class="purchace__subtit mt-30">{{atwrkDetail.dtPrt.atwrkNm}}, {{atwrkDetail.dtPrt.mkYY}}</p>
                                                            <span class="purchace__info mt-20">
                                                                디지털 에디션 판화<br/>
                                                                <!-- M 사이즈, 460 x 200 cm (옵션 선택가능)                                                       -->
                                                            </span>
                                                            <p class="purchace__price mt-30">{{commaPric normalPric}} 원</p>
                                                        </div>
                                                        <div class="purchace-mid border-bottom--1">
                                                            <div class="d-flex purchace-comp">
                                                                <p class="purchace-comp__tit">{{atwrkDetail.glry.glryNm}}</p>
                                                                <p class="purchace-comp__addr">{{atwrkDetail.glry.area}} {{atwrkDetail.glry.sigungu}} {{atwrkDetail.glry.dong}}</p>
                                                                <button type="button" name="getNews" class="purchace-comp__btn">
                                                                    <!-- <img src="/image/sub/icon/icon-alarm.png" alt=""> -->
                                                                    <img src="{{newsChk}}" alt="">
                                                                    소 식 받 기
                                                                </button>
                                                            </div>
                                                        </div>
                                                        <div class="purchace-block purchace-block--control">
                                                            <div class="purchace-control__select">
                                                                <div class="form-wrap">
                                                                    <div class="form-block form-row">
                                                                        <p class="width--90 font-12 fontW-500 color--txt">사이즈 선택</p>
                                                                        <div class="form-select form-select-custom flex-1">
                                                                            <button type="button" name="seltBtn" class="custom-select__tit pl-10">S {{commaPric atwrkDetail.dtPrt.sPric}}</button>
                                                                            <ul id="size" class="custom-select__options" style="display: none;top:3.1rem;">
                                                                                <li name="seltSize" class="is-active"><button name="sizeBtn" value="S" type="button">S {{commaPric atwrkDetail.dtPrt.sPric}}</button></li>
                                                                                <li name="seltSize"><button name="sizeBtn" value="M" type="button">M {{commaPric atwrkDetail.dtPrt.mPric}}</button></li>
                                                                                <li name="seltSize"><button name="sizeBtn" value="L" type="button">L {{commaPric atwrkDetail.dtPrt.lPric}}</button></li>
                                                                            </ul>
                                                                        </div>
                                                                    </div>
                                                                    <div class="form-block form-row">
                                                                        <p class="width--90 font-12 fontW-500 color--txt">액 자 선 택</p>
                                                                        <div class="form-select form-select-custom flex-1">
                                                                            <button type="button" name="seltFrame" class="custom-select__tit pl-10">  알루미늄</button>
                                                                            <ul id="frame" class="custom-select__options" style="display: none;top:3.1rem;">
                                                                                <li class="is-active"><button name="frameBtn" id="frame-001" type="button">알루미늄</button></li>
                                                                                <li class=""><button name="frameBtn" id="frame-002" type="button">나무액자</button></li>
                                                                            </ul>
                                                                        </div>
                                                                    </div>
                                                                    {{#if edation}}
                                                                    <div class="form-block form-row">
                                                                        <p class="width--90 font-12 fontW-500 color--txt">에디션 선택</p>
                                                                        <div class="form-select form-select-custom flex-1">
                                                                            <button type="button" class="custom-select__tit pl-10">  1</button>
                                                                            <ul class="custom-select__options" style="display: none;top:3.1rem;">
                                                                                <li class="is-active"><button type="button">1  </button></li>
                                                                                <li><button type="button">   2</button></li>
                                                                                <li><button type="button">   3 </button></li>
                                                                                <li><button type="button">   4 </button></li>
                                                                            </ul>
                                                                        </div>
                                                                    </div>
                                                                    {{/if}}
                                                                </div>
                                                                <p class="my-10 font-12 color--sea ta-r">남은 작품 {{leftAtCnt}} 점</p>
                                                            </div>
                                                            
                                                            {{#each midleList}}
                                                                <div class="purchace-control__num">
                                                                    <p class="w-100 mb-20 font-12 fontW-500 color--txt">{{numbering @index}}. {{this}}</p>
                                                                    <div class="product-count">
                                                                        <button name="msCnt" value="{{@index}}" class="button-count">-</button>
                                                                        <input type="text" readonly="" id="cnt{{@index}}" class="number-product" value="{{proCnt @index}}">
                                                                        <button name="psCnt" value="{{@index}}" class="button-count">+</button>                                                            
                                                                    </div>
                                                                    <p name="{{@index}}" class="ml-auto font-14 fontW-b color--txt">{{selDtPric @index}} 원 <a href="" id="{{this}}" name="cancelPr">X</a></p>
                                                                </div>
                                                            {{/each}}

                                                            <p class="purchace-control__count">
                                                                <span>총 상품 금액</span>
                                                                <em>총 수량 {{digitalCnt}}개</em>
                                                                <strong> {{commaPric totalPric}}원</strong>
                                                            </p>
                                                            <div class="btn-wrap mt-30 purchace__btns">
                                                                <a href="" name="dtPrtBuy" class="btn btn--blue btn--round">구 매 하 기</a>
                                                                <a href="" name="shBasket" class="btn btn--blue btn--round">장 바 구 니</a>
                                                            </div>
                                                        </div>
                                                        <div class="purchace-bot">
                                                            <div class="purchace-policy">
                                                                <p>
                                                                    <span>
                                                                        <img src="/image/sub/icon/icon-check.png" alt="">
                                                                    </span>
                                                                    일반택배 배송  
                                                                </p>
                                                            </div>
                                                            <div class="purchace-counts mt-40">
                                                                <p class="purchace-counts__favor">
                                                                    <span class="purchace-counts__favor--img"><img src="/image/sub/icon/icon-favor__count.png" alt=""></span>
                                                                    <span name="dtPrtGoodCnt">{{atwrkDetail.dtPrt.goodCnt}}</span>
                                                                </p>
                                                                <p class="purchace-counts__views">
                                                                    <span name="dtPrtViewCnt">{{atwrkDetail.dtPrt.viewCnt}}</span> Views
                                                                </p>
                                                            </div>
                                                        </div> 
                                                    </div>
                                                </div>
                                                <!-- 디지털 에디션 판화 끝 -->
                                            
                                    </div>
                                </div>
                                <div class="product-view__info">
                                    {{#with atstInfo}}
                                        <div class="product-view__info--author">
                                            <div class="author-name">
                                                <span class="author-name__img">
                                                    <img src="/image/sub/img-product__author--img01.png" alt="">
                                                </span>
                                                    {{atstInfo.atstNm}}
                                            </div>
                                            <div class="author-profile">
                                                {{atstInfo.atstDesc}}
                                            </div>
                                        </div>
                                        {{#if atstInfo.atstAddDesc}}
                                            <div class="product-view__info--history">
                                                <div class="author-history">
                                                    {{atstInfo.atstAddDesc}}
                                                    <!-- <a href="" class="underline">더보기</a> -->
                                                </div>
                                            </div>
                                        {{/if}}
                                    {{/with}}
                                </div>
                            </div>
                            <div class="product-others">
                                {{#with atwrkDetail}}
                                    <p class="product-others__tit"> {{atwrkDetail.glry.glryNm}} 다른 작품들</p>
                                {{/with}}
                                <div class="slide-wrap slide-list--product mt-50">
                                    <div class="swiper">
                                        <div class="swiper-wrapper">
                                            {{#each atwrkList}}
                                                <div class="swiper-slide">
                                                    <a href="/atwrkDetail/{{_id}}" name="otherAtwrk" id="{{_id}}">
                                                        <!-- 임시로 max-width/min 280px 넣음 -->
                                                        <img 
                                                            src=""
                                                            data-src="{{imgInfo.imgID}}"
                                                            class="testSample lazyload"
                                                            alt=""
                                                            style="max-width: 280px; min-width: 280px;"
                                                        >
                                                        <!-- <img style="max-width: 280px;" src="{{imgInfo.imgID}}" alt=""> ADDSCC -->
                                                    </a>
                                                    <div class="btn-wrap btn-slide--check">
                                                        <button type="button" name="otherBasket" value="{{flag}}" title="장바구니 넣기" >
                                                            <img src="/image/main/icon/icon-cart.svg" alt="">
                                                        </button>
                                                        <button type="button" title="찜하기" name="otherGoodBtn">
                                                            <img src="/image/main/icon/{{userGoodChk flag}}" alt="">
                                                        </button>
                                                    </div>
                                                    <p class="swiper-slide__tit">{{atstNm}}</p>
                                                    <p class="swiper-slide__txt">
                                                        {{#if dtpChk flag}}
                                                            <em>{{atwrkNm}}</em>
                                                        {{else}}
                                                            <em>{{atwrkNm}}, {{wSize}} x {{hSize}}, {{codeToName ogPrt "MATERIAL"}}</em>
                                                        {{/if}}
                                                        <em>{{glryNm}}</em>
                                                        <em>{{pric}} 원</em>
                                                    </p>
                                                </div>
                                            {{/each}}
                                        </div>
                                    </div>
                                    <div class="swiper-button-prev"></div>
                                    <div class="swiper-button-next"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 구매 / 비딩 / 가격문의 팝업 -->
            {{#if ogPrtChk}}
                {{> bidAmount this}}
                {{> bidAmtProcess this}}
                {{> bargainingAccept this}}
                {{> bargainingRate this}}
                {{> bargainingRefuse this}}
                {{> priceInquiryIns this}}
                {{> priceInquiryAns this}}
                {{> priceInquiryPay this}}
            {{/if}}

            {{/with}}
        </div>
    </section>
    <footer class="footer">
        {{> footer}}
    </footer>
    <!-- 팝업 템플릿 -->
    {{> utilsPopUp popup}}

    {{#if utilsJsRenderAfter}}
        <script type="text/javascript" src="/libs/common.js"></script>
        <script type="text/javascript" src="/libs/sub.js"></script>
    {{/if}}
</template>
