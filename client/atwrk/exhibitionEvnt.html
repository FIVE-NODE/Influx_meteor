<template name="exhibitionEvnt">
    <script type="text/javascript" src="/libs/common.js"></script>
    <script type="text/javascript" src="/libs/sub.js"></script>
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <div class="sub-content border-0">
                    <div class="sub-content__gallery">
                        <div class="gallery-wrap gallery-event">
                            <div class="gallery__inner">
                                <div class="gallery-mainSlide">
                                    <div class="swiper">
                                        <div class="swiper-wrapper">
                                            {{#if banr}}
                                                {{#each banr}}
                                                    <div class="swiper-slide">
                                                        <a href="">
                                                            <span class="gallery-swiper__img">
                                                                <img 
                                                                    src=""
                                                                    data-src="{{image}}"
                                                                    class="lazyload"
                                                                    alt=""
                                                                >
                                                            </span>
                                                            <span class="gallery-swiper__txt">
                                                                <strong>{{title}} {{codeToName evntTp "EVENT_TYPE"}} </strong>
                                                                <em>{{dateFormatChg strDt "."}} ~ {{dateFormatChg endDt "."}}</em>
                                                                <em>{{glry.glryNm}}</em>
                                                            </span>
                                                        </a>
                                                    </div>
                                                {{/each}}
                                            {{else}}
                                                {{#if evntBanrDataChk}}
                                                {{else}}
                                                    {{{customLoading "swiper-slide gallery-swiper__img" "400" "500"}}}
                                                {{/if}}
                                            {{/if}}
                                        </div>
                                    </div>
                                    <div class="swiper-button-next"></div>
                                    <div class="swiper-button-prev"></div>
                                </div>
                            </div>
                            <div class="gallery-sch mt-70">
                                <div class="gallery__inner">
                                    <div class="form-wrap">
                                        <div class="form-row">
                                            <div class="form-select form-select-custom width--250">
                                                <button type="button" class="custom-select__tit" name="kinds">전시 유형</button>
                                                <ul class="custom-select__options" id="selectEvnt" style="display: none;">
                                                    {{#each kinds}}
                                                        <li><button value="{{code}}" name="kind" type="button">{{name}}</button></li>
                                                    {{/each}}
                                                </ul>
                                            </div>
                                            <label class="form-input__label" style="width:40px;">검 색</label>
                                            <div class="form-input form-row">
                                                <input type="text" name="area" placeholder="지역 : 도시, 구, 동" />
                                                <button name="schBtn" type="button">
                                                    <img src="/image/common/icon/icon-search--black.png" alt="">
                                                </button>
                                            </div>
                                            <div class="form-input form-row">
                                                <input type="text" id="glryNm" placeholder="갤러리 이름" />
                                                <button name="schBtn" type="button">
                                                    <img src="/image/common/icon/icon-search--black.png" alt="">
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="gallery__inner" id="move">
                                <div class="gallery-list mt-70">
                                    {{#if evntList}}
                                        {{#each evntList}}
                                            <div class="gallery-item">
                                                <a href="">
                                                    <span class="gallery-item__img">
                                                        <img 
                                                            src=""
                                                            data-src="{{image}}"
                                                            class="lazyload"
                                                            alt=""
                                                        >
                                                        <!-- <img src="{{image}}" alt=""> -->
                                                    </span>
                                                    <span class="gallery-item__txt">
                                                        <strong>{{title}} ㅣ {{codeToName evntTp "EVENT_TYPE"}}</strong>
                                                        <em>{{dateFormatChg strDt "."}} ~ {{dateFormatChg endDt "."}}</em>
                                                        <em>{{glry.glryNm}}, {{glry.area}}, {{glry.dong}}</em>
                                                    </span>
                                                </a>
                                            </div>
                                        {{/each}}
                                    {{else}}
                                        {{#if evntListDataChk}}
                                        {{else}}
                                            <div class="gallery-item testSample" style="width: 378px; height: 301px;"></div>
                                            <div class="gallery-item testSample" style="width: 378px; height: 301px;"></div>
                                            <div class="gallery-item testSample" style="width: 378px; height: 301px;"></div>
                                            <div class="gallery-item testSample" style="width: 378px; height: 301px;"></div>
                                        {{/if}}
                                    {{/if}}
                                </div>
                            </div>
                            <div class="pagination-wrap mt-100 mb-60">
                                <div class="gallery__inner">
                                    <div class="form-select form-select-custom width--250">
                                        <button type="button" class="custom-select__tit" name="limit">10</button>
                                        <ul class="custom-select__options" style="display: none;">
                                            <li class="is-active"><button name="pageVal" value=10 type="button">10</button></li>
                                            <li><button name="pageVal" value=20  type="button">20</button></li>
                                            <li><button name="pageVal" value=30  type="button">30</button></li>
                                        </ul>
                                    </div>
                                    <!-- 페이징 영역 -->
                                    <div class="pagination">
                                        <div class="pagination">
                                            <a href="" name="prev" class="link-prev"></a>
                                            {{#each page}}
                                                <a href="" id="pageNum{{num}}" name="pageNum" class="{{active}}">{{num}}</a>
                                            {{/each}}
                                            <a href="" name="next" class="link-next"></a>
                                        </div>
                                    </div>
                                    <!-- 페이징 영역 끝 -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</template>
