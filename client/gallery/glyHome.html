<template name="glyHome">
    <script type="text/javascript" src="/libs/common.js"></script>
    <script type="text/javascript" src="/libs/sub.js"></script>
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <div class="sub-content border-0">
                    <div class="sub-content__gallery">
                        <div class="gallery-wrap">
                            <div class="gallery__inner">
                                <div class="gallery-mainSlide">
                                    <div class="swiper">
                                        <div class="swiper-wrapper">
                                            {{#if newGallery}}
                                                {{#each newGallery}}
                                                    <div class="swiper-slide">
                                                        <a href="" name="detail" value="{{_id}}">
                                                            <span class="gallery-swiper__img">
                                                                <img 
                                                                    src=""
                                                                    data-src="{{glryImage}}"
                                                                    class="glryHome-newGlry-maxSize lazyload"
                                                                    alt=""
                                                                >
                                                                <!-- <img class="glryHome-newGlry-maxSize" src="{{glryImage}}" alt=""> -->
                                                            </span>
                                                            <span class="gallery-swiper__txt">
                                                                <em>{{glryNm}}</em>
                                                                {{area}}, {{dong}}
                                                            </span>
                                                        </a>
                                                    </div>
                                                {{/each}}
                                            {{else}}
                                                {{#if newGlryDataChk}}
                                                {{else}}
                                                    <div class="swiper-slide">
                                                        <span class="gallery-swiper__img">
                                                            <div class="testSample" style="width:773px; height: 462px; border-radius: 20px;"></div>                                                        
                                                        </span>
                                                    </div>
                                                    
                                                    <div class="swiper-slide">
                                                        <span class="gallery-swiper__img">
                                                            <div class="testSample" style="width:773px; height: 462px; border-radius: 20px;"></div>                                                        
                                                        </span>
                                                    </div>
                                                {{/if}}
                                            {{/if}}
                                        </div>
                                    </div>

                                    <div class="swiper-button-next"></div>
                                    <div class="swiper-button-prev"></div>
                                </div>
                            </div>
                            <div class="gallery__inner">
                                <div class="gallery-sch mt-70">
                                    <div class="form-wrap">
                                        <div class="form-row">
                                            <label for="for-input__label" class="form-input__label">갤러리 검색</label>
                                            <div class="form-input form-row">
                                                <input type="text" name="addr" placeholder="지역 : 도시, 동" />
                                                <button name="searchBtn" type="button">
                                                    <img src="/image/common/icon/icon-search--black.png" alt="">
                                                </button>
                                            </div>
                                            <div class="form-input form-row ml-100">
                                                <input type="text" name="glryNm" placeholder="갤러리 이름" id="for-input__label" />
                                                <button name="searchBtn" type="button">
                                                    <img src="/image/common/icon/icon-search--black.png" alt="">
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="gallery__inner">
                                <div class="gallery-list mt-70">
                                    {{#if searchGallery}}
                                        {{#each searchGallery}}
                                            <div class="gallery-item">
                                                <a href="" name="detail" value="{{_id}}">
                                                    <span class="gallery-item__img">
                                                        <img 
                                                            src=""
                                                            data-src="{{glryImage}}"
                                                            class="testSample lazyload"
                                                            alt=""
                                                        >
                                                        <!-- <img src="{{glryImage}}" alt=""> ADDSCC -->
                                                    </span>
                                                    <span class="gallery-item__txt">
                                                        <em>{{glryNm}}</em>
                                                        {{area}}, {{dong}}
                                                    </span>
                                                </a>
                                            </div>
                                        {{/each}}
                                    {{else}}
                                        {{#if glryDataChk}}
                                        {{else}}
                                            <div class="gallery-item testSample" style="width: 299px; height: 281px;"></div>
                                            <div class="gallery-item testSample" style="width: 299px; height: 281px;"></div>
                                            <div class="gallery-item testSample" style="width: 299px; height: 281px;"></div>
                                            <div class="gallery-item testSample" style="width: 299px; height: 281px;"></div>
                                            <div class="gallery-item testSample" style="width: 299px; height: 281px;"></div>
                                        {{/if}}
                                    {{/if}}
                                </div>
                                <div class="gallery__inner">
                                    <div class="pagination-wrap mt-100 mb-60">
                                        <div class="pagination">
                                            <a href="" name="prev" class="link-prev"></a>
                                            {{#each page}}
                                                <a href="" id="pageNum{{num}}" name="pageNum" class="{{active}}">{{num}}</a>
                                            {{/each}}
                                            <a href="" name="next" class="link-next"></a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        {{> footer}}
    </footer>
</template>
