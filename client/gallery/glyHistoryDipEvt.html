<template name="glyHistoryDipEvt">
    <script type="text/javascript" src="/libs/common.js"></script>
    <script type="text/javascript" src="/libs/sub.js"></script>
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <h3 class="subTit">
                    <span class="subTit__inner">
                        지난 전시회  및 행사
                    </span>
                </h3>
                <div class="sub-content">
                    <div class="sub-content__event">
                        <ul class="bradCrumb bradCrumb-sub">
                            <li>GALLERY</li>
                            <li>{{glryInfo}}</li>
                            <li>전시 및 행사</li>
                            <li>지난전시 및 행사</li>
                        </ul>
                        <div class="event-wrap mt-30 mb-100">
                            <div class="event-list">
                                {{#each historyInfo}}
                                    <div class="event-item">
                                        <a href="/glyDipEvt/{{_id}}">
                                            <span class="event-item__img">
                                                <img src="{{image}}" alt="">
                                            </span>
                                            <span class="event-item__cate">{{codeToName evntTp "EVENT_TYPE"}}</span>
                                            <p class="event-item__tit">{{title}}</p>
                                            <em class="event-item__date">{{dateFormat strDt}} ~ {{dateFormat endDt}}</em>
                                        </a>
                                    </div>
                                {{/each}}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</template>
