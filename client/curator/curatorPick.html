<template name="curatorPick">
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <div class="sub-content">
                    <div class="sub-content__curator">
                        <div class="curator-wrap">
                            <div class="curator-intro">
                                <div class="curator-intro__top">
                                    <div class="curator__inner d-flex">
                                        <p class="curator-intro__tit flex-4">큐레이터 픽!!</p>
                                        <p class="curator-intro__txt flex-5">
                                            <span>큐레이터 픽!!은 influx의 전문 미술 큐레이터가 트랜드에 따라 테마를 정하고 작품을 선정하였습니다. </span>
                                            <span>( Curator Pick!!! is a section for new trend’s artworks the influx’s professional curator selects )</span>
                                        </p>
                                    </div>
                                </div>

                                <div class="curator-intro__bot">
                                    <div class="curator__inner">
                                        {{#each pickList}}
                                            <div class="curator-kind curator-kind--original">
                                                <p class="curator-kind__tit">큐레이터 픽!! {{codeToName thmTp "THM_TP"}} </p>
                                                <div class="curator-kind__info">
                                                    <a href="/{{codeToUrl thmTp}}" name="detailBtn" id="{{thmTp}}">
                                                        <span class="curator-kind__info--img">
                                                            <img src="{{image}}" alt="">
                                                            <strong>
                                                                Curator Pick!!
                                                                <em>{{codeToEngSub thmTp}}</em>
                                                            </strong>
                                                        </span>
                                                    </a>
                                                    <p class="curator-kind__info--txt">
                                                        <strong>{{thmNm}}</strong>
                                                        <em>
                                                           {{thmDesc}}
                                                        </em>
                                                    </p>
                                                </div>
                                            </div>
                                        {{/each}}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        {{> footer}}
    </footer>
</template>
