<template name="pickCreate">
    <script type="text/javascript" src="/libs/common.js"></script>
    <script type="text/javascript" src="/libs/sub.js"></script>
    <section class="container">
        <div class="content">
            <div class="content__inner">
                <div class="subTit subTit-tit--center">
                    <div class="subTit__inner  d-flex align-center">
                        <a href="/aOne">
                            <img src="/image/common/img-logo-default.png" alt="">
                        </a>
                        <p class="subTit-tit--center__p">큐레이터 픽!!  등록</p>
                    </div>
                </div>
                <div class="sub-content">
                    <div class="sub-content__curator">
                        <div class="curator-wrap">
                            <div class="layout-curator layout-curator--apply">
                                <div class="layout-curator__inner">
                                    <div class="tab-wrap mt-20">
                                        <div class="w-100 border-bottom--1">
                                            <div class="tab-basic width--1315">
                                                <a href="" name="prt" id="001" class="is-active">큐레이터 픽!! 원화</a>
                                                <a href="" name="prt" id="002" >큐레이터 픽!! 디지털 판화</a>
                                                <a href="" name="prt" id="003" >큐레이터 픽!! 작가</a>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="tab-tit-area">
                                        <div class="d-flex align-center width--1315 mx-auto">
                                            {{#with seltPickSch}}
                                            <span class="img-wrap">
                                                <img style="max-width: 100px;" src="{{image}}" alt="">
                                            </span>
                                                <p class="ml-40 font-16 fontW-b color--txt"> {{thmNm}} </p>
                                            {{/with}}
                                            <div class="btn-wrap ml-auto">
                                                <button type="button" class="btn btn--white btn--round font-14 fontW-b">게시물 올리기</button>
                                                <button type="button" class="btn btn--white btn--round font-14 fontW-b">게시물 내리기</button>
                                                <button type="button" name="preView" data-id="curator_preview_popup" class="popup btn btn--white btn--round font-14 fontW-b">미리보기</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="tab-info tab-info--write width--1315 mx-auto">
                                        <div class="d-flex">
                                            <dl class="tab-info__dl col-11">
                                                <dt>대표 사진 올리기</dt>
                                                <dd>
                                                    <div class="upload-box" style="background-size: contain; background-image: url(/temp/{{preViewImg}}); background-repeat: no-repeat;
                                                    background-position: center center;">
                                                        <p class="upload-box__txt">
                                                            이미지를 드래그하여<br/>업로드 할수 있습니다
                                                        </p>
                                                        <input id="upload-input" name="img-upload" type="file" accept=".png, .jpeg, .jpg"  style="display:none" />
                                                        <button name="upload-btn" type="button" class="upload-box__btn">사진 올리기</button>
                                                    </div>
                                                </dd>
                                                <dt>주제 및 테마 제목 </dt>
                                                <dd>
                                                    <div class="form-wrap">
                                                        <div class="form-input">
                                                            <input type="text" name="pickTitle" class="width--650" placeholder="예) 봄을 맞이 큐레이터 픽!!    “Transform”">
                                                        </div>
                                                    </div>
                                                </dd>
                                                <dt>설     명</dt>
                                                <dd>
                                                    <div class="form-wrap">
                                                        <div class="form-textarea">
                                                            <!-- &#13;&#10; -->
                                                            <textarea  name="pickDesc" id="" class="width--650" placeholder="예) 2023년 새 봄의 테마, ‘Transform’, 로 집 분위기를 바꿀수 있는 그림을 선보입니다.     집, 사무실 분위기를 Transform 바꿔보세요."></textarea>
                                                        </div>
                                                    </div>
                                                </dd>
                                            </dl>
                                            <div class="btn-wrap col-1">
                                                <button type="button" name="savePick" class="btn btn--white btn--round">저 장</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="table-wrap width--1315 mx-auto mt-25">
                                        <div class="table-cpat d-flex align-center">
                                            <p class="table-cpat__txt pl-40 font-16 color--txt">등록 작품 리스트</p>
                                            <div class="btn-wrap ml-auto">
                                                <button type="button" name="seltDelete" class="btn btn--darkgray height-36 font-14 btn--round">선 택 삭 제</button>
                                                <button type="button" name="crAtwrkSch" data-id="atwrkSch" class="popup btn btn--blue height-36 ml-20 font-14 btn--round">등록할 작품 검색</button>
                                            </div>
                                        </div>
                                        <table class="table-basic table--col table--list table-basic--curator__list mt-20">
                                            <caption></caption>
                                            <colgroup>
                                                <col style="width:5%">
                                                <col style="width:10%">
                                                <col style="width:10%">
                                                <col style="width:auto">
                                                <col style="width:10%">
                                                <col style="width:10%">
                                                <col style="width:12%">
                                                <col style="width:10%">
                                                <col style="width:8%">
                                            </colgroup>
                                            <thead>
                                                <tr>
                                                    <th scope="col">
                                                        <div class="form-wrap">
                                                            <div class="form-check">
                                                                <input type="checkbox" name="allSelt" id="" value="" class="form-check__input form-check--all">
                                                            </div>
                                                        </div>
                                                    </th>
                                                    <th scope="col">작품 사진 </th>
                                                    <th scope="col">아티스트</th>
                                                    <th scope="col">설  명 </th>
                                                    <th scope="col">작품년도</th>
                                                    <th scope="col">작품가격 (원)</th>
                                                    <th scope="col">판매기간</th>
                                                    <th scope="col">갤러리</th>
                                                    <th scope="col">삭 제</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {{#with seltPickSch}}
                                                    {{#each atstAtwrk}}
                                                        <tr>
                                                            <td>
                                                                <div class="form-wrap">
                                                                    <div class="form-check">
                                                                        <input type="checkbox" name="selt" value="{{atwrkID}}" class="form-check__input">
                                                                    </div>
                                                                </div>
                                                            </td>
                                                            <td>
                                                                <span class="img-wrap">
                                                                    <img class="pickCreate-img" src="{{testImage}}" alt="">
                                                                </span>
                                                            </td>
                                                            <td>{{atstNm}}</td>
                                                            <td>{{atwrkNm}}, {{wSize}} x {{hSize}},  {{codeToName metRias "MATERIAL"}}</td>
                                                            <td>{{mkYY}}</td>
                                                            <td>{{commaPric pric}}</td>
                                                            <td>{{dateFormatChg strDt "."}} ~ {{dateFormatChg endDt "."}}</td>
                                                            <td>{{glryNm}}</td>
                                                            <td>
                                                                <button type="button" class="popup" name="delete" value="{{atwrkID}}">
                                                                    <img src="/image/sub/icon/icon-delete.png" alt="">
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    {{/each}}
                                                {{/with}}
                                            </tbody>
                                        </table>

                                        <div class="pagination-wrap mt-40 mb-40"></div>

                                        <!-- <div class="pagination-wrap mt-40 mb-40">
                                            <div class="pagination">
                                                <a href="" class="link-prev"></a>
                                                <a href="" class="is-active">1</a>
                                                <a href="">2</a>
                                                <a href="">3</a>
                                                <a href="">4</a>
                                                <a href="">5</a>
                                                <a href="" class="link-next"></a>
                                            </div>
                                        </div> -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    {{> curatorPreview}}
    {{> curatorRegSch}}

    <div class="popup-layout" id="confirm_popup">
        <div class="popup-wrap">
            <div class="popup-inner" style="width:347px;">
                <div class="popup-head">
                    <p class="popup-head__tit"></p>
                    <button type="button" class="popup-close">
                        <img src="/image/common/icon/icon-popup-close.png" alt="">
                    </button>
                </div>
                <div class="popup-cont">
                    <p class=" mt-30 font-14 fontW-b color--txt ta-c">정말 삭제 하시겠습니까?</p>
                    <div class="btn-wrap d-flex justify-center mt-40">
                        <button type="button" class="btn btn--white btn--round width--170 height-40 font-pre popup-chk">취   소</button>
                        <button type="button" name="yDelete" class="btn btn--blue btn--round width--170 height-40 ml-20 font-pre">삭  제</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        {{> footer}}
    </footer>
</template>
