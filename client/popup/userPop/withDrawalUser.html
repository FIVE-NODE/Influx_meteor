<template name="withDrawalUser">
    <div class="popup-layout" id="withDrawalUser_popup">
        <div class="popup-wrap">
            
            <div class="popup-inner" style="width:803px; height:800px;">
                <div class="popup-head">
                    <p class="popup-head__tit">회원 탈퇴</p>
                    <button type="button" class="popup-close">
                        <img src="/image/common/icon/icon-popup-close.png" alt="">
                    </button>
                </div>
                <div class="popup-cont popup-cont--terms">
                    <div class="ov-auto scrollbar" style="height:600px;">
                        <h3 class="memberOut-tit">회원탈퇴 신청</h3>
                        <h4 class="memberOut-subtit mt-40">회원 탈퇴 신청에 앞서 아래 내용을 반드시 확인해주세요.</h4>
                        <div class="memberOut-termBox mt-15">
                            <strong>회원탈퇴 시 처리내용</strong>
                            <ul class="lists lists-dot lists-dot--big mt-30">
                                <li>인플럭스의 포인트·쿠폰은 소멸되며 환불되지 않습니다.</li>
                                <li>인플럭스의 구매 정보가 삭제됩니다.</li>
                                <li>
                                    소비자보호에 관한 법률 제6조에 의거,계약 또는 청약철회 등에 관한 기록은 5년, 대금결제 및 재화등의 공급에 관한 기록은 5년, 소비자의 불만 또는 분쟁처리에 관한 기록은 3년 동안 보관됩니다. 동 개인정보는 법률에 의한 보유 목적 외에 다른 목적으로는 이용되지 않습니다.
                                </li>
                            </ul>
                            <strong class="mt-30">회원탈퇴 시 게시물 관리</strong>
                            <p class="mt-30">
                                회원탈퇴 후 인플럭스 서비스에 입력한 관심 및 게시물은 삭제되지 않으며, 회원정보 삭제로 인해 작성자 본인을 확인할 수 없으므로 게시물 편집 및 삭제 처리가 원천적으로 불가능 합니다. 게시물 삭제를 원하시는 경우에는 먼저 해당 게시물을 삭제 하신 후, 탈퇴를 신청하시기 바랍니다.                                        
                            </p>
                            <strong class="mt-30">회원탈퇴 후 재가입 규정</strong>
                            <p class="mt-30">탈퇴 회원이 재가입하더라도 기존의 인플럭스의 포인트 및 혜택은 이미 소멸되었기 때문에 양도되지 않습니다.</p>
                        </div>
                        <div class="form-wrap mt-15 ml-10">
                            <div class="form-check">
                                <input type="checkbox" id="check-memberOut--allCheck">
                                <label for="check-memberOut--allCheck" class=" ml-10">
                                    위 내용을 모두 확인하였습니다. 
                                    <span class="font-14 fontW-500 color-blue">필수</span>
                                </label>
                            </div>
                        </div>
                        <h4 class="memberOut-subtit mt-40">
                            인플럭스 회원에서 탈퇴하려는 이유가 무엇인가요? (복수선택 가능) 
                            <span class="color-blue fontW-b">필수</span>
                        </h4>
                        <div class="memberOut-termBox memberOut-termBox--checks mt-15">
                            <div class="form-wrap">
                                <div class="form-check">
                                    <input type="checkbox" name="some" value="001" id="check-memberOut--reason01">
                                    <label for="check-memberOut--reason01">이용빈도 낮음</label>
                                </div>
                                <div class="form-check mt-20">
                                    <input type="checkbox" name="some" value="002" id="check-memberOut--reason02">
                                    <label for="check-memberOut--reason02">재가입</label>
                                </div>
                                <div class="form-check mt-20">
                                    <input type="checkbox" name="some" value="003" id="check-memberOut--reason03">
                                    <label for="check-memberOut--reason03">콘텐츠/제품정보/상품 부족</label>
                                </div>
                                <div class="form-check mt-20">
                                    <input type="checkbox" name="some" value="004" id="check-memberOut--reason04">
                                    <label for="check-memberOut--reason04">개인정보보호</label>
                                </div>
                                <div class="form-check mt-20">
                                    <input type="checkbox" name="some" value="005" id="check-memberOut--reason05">
                                    <label for="check-memberOut--reason05">회원특혜/쇼핑혜택 부족</label>
                                </div>
                                <div class="form-check mt-20">
                                    <input type="checkbox" name="some" value="006" id="check-memberOut--reason06">
                                    <label for="check-memberOut--reason06">기타</label>
                                </div>
                            </div>
                        </div>
                        <h4 class="memberOut-subtit mt-40">
                            인플럭스 서비스 이용 중 어떤 부분이 불편하셨나요? 
                            <span class="color--gray fontW-b">선택</span>
                        </h4>
                        <p class="mt-10 font-12 fontW-500 color--txt">여러분의 소중한 의견을 반영해 더 좋은 서비스로 꼭 찾아뵙겠습니다.</p>
                        <div class="form-wrap mt-10">
                            <div class="form-textarea">
                                <textarea name="texts" id="areaText" maxlength="2000" placeholder="인플럭스에 떠나는 이유를 자세히 알려주신다면 서비스의 개선에 큰 도움이 됩니다. "></textarea>
                                <span class="font-12 color--gray">
                                    {{inconvenience}} / 2000
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="btn-wrap d-flex justify-center mt-40">
                        <button type="button" class="btn btn--white btn--round width--170 height-40 font-pre popup-chk">취소하기</button>
                        <button type="button" name="withDrawal" class="btn btn--blue btn--round width--170 height-40 ml-20 font-pre">탈퇴신청하기</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
