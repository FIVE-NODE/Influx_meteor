<template name="utilsPopUp">
    <div class="popup-layout" id="utilsPopUp">
        <div class="popup-wrap">
            <div class="popup-inner" style="width:391px;">
                <div class="popup-head">
                    <p class="popup-head__tit">알 림</p>
                    <button type="button" class="popup-close">
                        <img src="/image/common/icon/icon-popup-close.png" alt="">
                    </button>
                </div>
                <div class="popup-cont popup-cont--bidding">
                    <div class="bid-wrap">
                        <div class="bid-write bid-write--inquire">
                            <div class="width--266 mx-auto">
                                <p class="mt-20 font-14 fontW-b color--txt ta-c">{{{message}}}</p>
                            </div>
                            <div class="btn-wrap d-flex {{divClassFlag}} mt-30">
                                {{#if btn}}
                                    {{#each btn}}
                                        {{#if routeFlag route}}
                                            <button type="button" class="popup-chk btn btn--blue width--135 font-11">{{name}}</button>
                                        {{else}}
                                            <a href="{{route}}">
                                                <button type="button" class="popup-chk btn btn--blue width--135 font-11">{{name}}</button>
                                            </a>
                                        {{/if}}
                                    {{/each}}
                                {{else}}
                                    <button type="button" class="popup-chk btn btn--blue width--135 mr-10 font-11">확 인</button>
                                {{/if}}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
