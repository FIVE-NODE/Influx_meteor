<template name="biddingInput">
    <div class="popup-layout is-open" id="">
        <div class="popup-wrap">
            <div class="popup-inner" style="width:391px;">
                <div class="popup-head">
                    <p class="popup-head__tit">비 딩 하 기</p>
                    <button type="button" class="popup-close">
                        <img src="/image/common/icon/icon-popup-close.png" alt="">
                    </button>
                </div>
                <div class="popup-cont popup-cont--bidding">
                    <div class="bid-wrap">
                        <div class="bid-write bid-write--admit">
                            <p class="bid-tit">
                                현재 비딩가격: <span>5,300,000</span>원    (즉시구매가: <span>7,500,000</span>원  )
                            </p>
                            <p class="mt-10 font-12 color--8b ta-c">현재 비딩인원  <span>3</span> 명</p>
                            <p class="mt-30 font-14 fontW-b color--black ta-c">나의 비딩 가격 </p>
                            <div class="bid-priceCount form-wrap mt-40">
                                <div class="form-row">
                                    <label for="">최소비딩금액  3%</label>
                                    <div class="form-input form-row">
                                        <input type="text" placeholder="0">
                                        원
                                    </div>
                                </div>
                            </div>
                            <p class="mt-10 color--sea font-11" style="letter-spacing:0.05rem;">*최소 비딩금액 3%이상의 가격을 자유롭게 직접입력할 수 있습니다. </p>
                            <div class="bid-priceRate mt-25">
                                <div class="bid-priceRate__sale bid-priceRate__sale01">
                                    <button type="button">
                                        <span>5,415,000</span>원
                                    </button>
                                    <p>3%</p>
                                </div>
                                <div class="bid-priceRate__sale bid-priceRate__sale02">
                                    <button type="button">
                                        <span>5,565,000</span>원
                                    </button>
                                    <p>5%</p>
                                </div>
                                <div class="bid-priceRate__sale bid-priceRate__sale03">
                                    <button type="button">
                                        <span>5,83,000</span>원
                                    </button>
                                    <p>10%</p>
                                </div>
                            </div>
                            <div class="btn-wrap d-flex justify-center mt-60">
                                <button type="button" class="btn btn--white">계 속 진 행</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
