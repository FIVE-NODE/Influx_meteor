<template name="haggling">
    <div class="popup-layout is-open" id="">
        <div class="popup-wrap">
            <div class="popup-inner" style="width:463px;">
                <div class="popup-head">
                    <p class="popup-head__tit">흥  정 </p>
                    <button type="button" class="popup-close">
                        <img src="/image/common/icon/icon-popup-close.png" alt="">
                    </button>
                </div>
                <div class="popup-cont popup-cont--deal">
                    <p class="font-14 fontW-500 color--txt underline">받는사람:갤러리 K</p>
                    <div class="deal-wrap mt-20">
                        <div class="deal-box">
                            <div class="form-wrap">
                                <div class="form-row">
                                    <div class="form-radio">
                                        <input type="radio" name="radio-deal" id="radio-deal--01">
                                    </div>
                                    <label for="radio-deal--01">
                                        1,000,000 원
                                        <span class="color-blue">현 판매 가격</span>
                                    </label>
                                </div>
                                <div class="form-row">
                                    <div class="form-radio">
                                        <input type="radio" name="radio-deal" id="radio-deal--02">
                                    </div>
                                    <label for="radio-deal--02">
                                        950,000 원
                                        <span class="color-blue">판매 가격의 -5% </span>
                                    </label>
                                </div>
                                <div class="form-row">
                                    <div class="form-radio">
                                        <input type="radio" name="radio-deal" id="radio-deal--03">
                                    </div>
                                    <label for="radio-deal--03">
                                        900,000 원
                                        <span class="color-blue">판매 가격의 -10%</span>
                                    </label>
                                </div>
                                <div class="form-row">
                                    <div class="form-radio">
                                        <input type="radio" name="radio-deal" id="radio-deal--04">
                                    </div>
                                    <label for="radio-deal--04">
                                        850,000 원
                                        <span class="color-blue">판매 가격의 -15%</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p class="mt-20 font-14 fontW-b color--txt ta-c">이 작품을 판매가격 -10%인  900,000원에 구매 의사가 있습니다. </p>
                    <div class="btn-wrap d-flex justify-center mt-30">
                        <button type="button" class="btn btn--white btn--round width--170 height-45 font-pre">취         소</button>
                        <button type="button" class="btn btn--blue btn--round width--170 height-45 ml-40">가격 제안 보내기</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
