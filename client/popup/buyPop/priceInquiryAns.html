<template name="priceInquiryAns">
    <div class="wrap">
        <!-- popup -->
        <div class="popup-layout" id="">
            <div class="popup-wrap">
                <div class="popup-inner" style="width:463px;">
                    <div class="popup-head">
                        <p class="popup-head__tit">작품가격문의 </p>
                        <button type="button" class="popup-close">
                            <img src="/image/common/icon/icon-popup-close.png" alt="">
                        </button>
                    </div>
                    <div class="popup-cont popup-cont--priceAsk">
                        <p class="font-14 fontW-500 color--txt underline">받는사람:갤러리 K</p>
                        <div class="priceAsk-wrap">
                            <div class="priceAsk-tit">
                                <span class="priceAsk-tit__img">
                                    <img class="popupAtarkSize" src="/image/sub/img-priceAsk--item01.png" alt="">
                                </span>
                                <span class="priceAsk-tit__txt">
                                    <em>백남준</em>
                                    <em>색의 변주곡 #980816, 1998</em>
                                    <em>120x230 cm, 캔버스에 유화</em>
                                </span>
                            </div>
                            <div class="priceAsk-msg">
                                <p class="priceAsk-msg__tit">메세지</p>
                                <div class="form-wrap">
                                    <div class="form-textarea">
                                        <textarea name="" id=""></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="priceAsk-msg priceAsk-msg--reply">
                                <p class="priceAsk-msg__tit">가격문의 답장</p>
                                <div class="form-wrap">
                                    <div class="form-textarea">
                                        <textarea name="" id=""></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="priceAsk-finalInfo mt-20">
                            <div class="finalInfo-sect finalInfo-sect01">
                                <p>작품가격 입력</p>
                                <div class="form-wrap">
                                    <div class="form-row border-1 border-radius--5">
                                        <div class="form-input">
                                            <input type="text">
                                        </div>
                                        <label>원</label>
                                    </div>
                                </div>
                            </div>
                            <div class="finalInfo-sect finalInfo-sect02">
                                <p>판매 수수료</p>
                                <span class="color--sea fontW-b">5 %</span>
                            </div>
                            <div class="finalInfo-sect finalInfo-sect03">
                                <p>최종 판 매  금액</p>
                                <span>8,400,000<em>원</em></span>
                            </div>
                        </div>
                        <div class="btn-wrap d-flex justify-center mt-50">
                            <button type="button" class="btn btn--white btn--round width--170 height-45 font-pre">취         소</button>
                            <button type="button" class="btn btn--blue btn--round width--170 height-45 ml-40">문의하기</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
